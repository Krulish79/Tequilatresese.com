<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- ═══════════ SLIDE 02 · MANIFIESTO ═══════════
       Full-bleed atmospheric photograph (Reposado bottle on wooden barrel
       with copa and smoke) as background. Big italic manifesto text overlaid
       on the left, dark noir scrim ensures legibility. -->

  <defs>
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F0C08" stop-opacity="0.94"/>
      <stop offset="40%" stop-color="#0F0C08" stop-opacity="0.72"/>
      <stop offset="70%" stop-color="#0F0C08" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0F0C08" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="bottomFade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0F0C08" stop-opacity="0.7"/>
      <stop offset="30%" stop-color="#0F0C08" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background photograph -->
  <image xlink:href="../../images/Tequila Bottle Photography.jpg"
         x="0" y="0" width="1920" height="1080"
         preserveAspectRatio="xMidYMid slice"/>

  <!-- Left-to-right dark scrim for text legibility -->
  <rect width="1920" height="1080" fill="url(#scrim)"/>
  <rect width="1920" height="1080" fill="url(#bottomFade)"/>

  <!-- Header strip -->
  <image xlink:href="../../images/Logos/logo-primary-white.png" x="120" y="88" width="90" height="60" preserveAspectRatio="xMinYMid meet"/>
  <text x="220" y="128" font-family="Cormorant Garamond, Georgia, serif" font-size="18" font-style="italic" fill="#FBF7EE">Tres Ese</text>
  <text x="1800" y="128" text-anchor="end" font-family="Inter, sans-serif" font-size="12" letter-spacing="4.5" fill="#E8CD8C">02 · MANIFIESTO</text>
  <line x1="120" y1="160" x2="1800" y2="160" stroke="#E8CD8C" stroke-opacity="0.32" stroke-width="1"/>

  <!-- Eyebrow -->
  <text x="120" y="330" font-family="Inter, sans-serif" font-size="14" letter-spacing="6" fill="#E8CD8C" font-weight="500">NUESTRA PROMESA</text>

  <!-- Big manifesto title -->
  <text x="120" y="470" font-family="Cormorant Garamond, Georgia, serif" font-size="100" font-weight="500" fill="#FBF7EE">Certificado</text>
  <text x="120" y="580" font-family="Cormorant Garamond, Georgia, serif" font-size="100" font-weight="500" font-style="italic" fill="#E8CD8C">orgánico.</text>
  <text x="120" y="700" font-family="Cormorant Garamond, Georgia, serif" font-size="100" font-weight="500" fill="#FBF7EE">Cero <tspan font-style="italic" fill="#E8CD8C">aditivos.</tspan></text>
  <text x="120" y="820" font-family="Cormorant Garamond, Georgia, serif" font-size="100" font-weight="500" fill="#FBF7EE">Siempre.</text>

  <!-- Copper rule -->
  <line x1="120" y1="870" x2="240" y2="870" stroke="#E8CD8C" stroke-opacity="0.7" stroke-width="1"/>

  <!-- Support paragraph -->
  <text x="120" y="930" font-family="Cormorant Garamond, Georgia, serif" font-size="22" fill="#FBF7EE" fill-opacity="0.9">
    <tspan x="120" dy="0">Cinco generaciones de la <tspan font-style="italic" fill="#E8CD8C">familia Tres Ese</tspan> han trabajado la tierra roja de</tspan>
    <tspan x="120" dy="34">Los Altos de Jalisco sin herbicidas, sin fertilizantes sintéticos, sin atajos.</tspan>
  </text>

  <!-- Footer strip -->
  <line x1="120" y1="1010" x2="1800" y2="1010" stroke="#E8CD8C" stroke-opacity="0.24" stroke-width="1"/>
  <text x="120" y="1050" font-family="Inter, sans-serif" font-size="11" letter-spacing="3.5" fill="#E8CD8C" fill-opacity="0.7">TEQUILA TRES ESE</text>
  <text x="1800" y="1050" text-anchor="end" font-family="Inter, sans-serif" font-size="11" letter-spacing="3.5" fill="#E8CD8C" fill-opacity="0.7">MANIFIESTO DE MARCA</text>
</svg>
