<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- ═══════════ SLIDE 09 · CONTACTO ═══════════
       Literal port of index.html <section class="contact"> — split
       .contact-copy (left) and .contact-form (right) layout. Since a
       real form doesn't work in a slide, the right column is rendered
       as a "cómo pedir" info card that mirrors the form's visual weight. -->

  <defs>
    <linearGradient id="contactBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C1813"/>
      <stop offset="100%" stop-color="#3D2E1F"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#contactBg)"/>

  <!-- ─── LEFT COLUMN · .contact-copy ─── -->
  <g id="contact-copy" transform="translate(120, 200)">
    <!-- eyebrow -->
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="14" letter-spacing="5.5" fill="#E8CD8C" font-weight="500">CONTACTO</text>

    <!-- display-sm title (matches site copy) -->
    <text x="0" y="110" font-family="Cormorant Garamond, Georgia, serif" font-size="72" font-weight="500" fill="#FBF7EE">Escríbele a nuestra</text>
    <text x="0" y="190" font-family="Cormorant Garamond, Georgia, serif" font-size="72" font-weight="500" font-style="italic" fill="#E8CD8C">familia<tspan fill="#FBF7EE" font-style="normal">.</tspan></text>

    <!-- Intro paragraph -->
    <text x="0" y="280" font-family="Inter, sans-serif" font-size="18" fill="#FBF7EE" fill-opacity="0.85">
      <tspan x="0" dy="0">Saluda. Leemos cada mensaje nosotros mismos —</tspan>
      <tspan x="0" dy="28">preferiblemente con una copita en la mano.</tspan>
    </text>

    <!-- Address block -->
    <text x="0" y="410" font-family="Cormorant Garamond, Georgia, serif" font-size="22" font-style="normal" fill="#FBF7EE" fill-opacity="0.95">
      <tspan x="0" dy="0">Tequila Tres Ese</tspan>
      <tspan x="0" dy="34">Los Altos de Jalisco, México</tspan>
    </text>

    <!-- Phone -->
    <text x="0" y="530" font-family="Inter, sans-serif" font-size="11" letter-spacing="4" fill="#E8CD8C" fill-opacity="0.8" font-weight="500">PEDIDOS Y CONSULTAS</text>
    <text x="0" y="580" font-family="Cormorant Garamond, Georgia, serif" font-size="34" font-style="italic" font-weight="500" fill="#E8CD8C">+52 55 5292 8284</text>

    <!-- Divider -->
    <line x1="0" y1="640" x2="200" y2="640" stroke="#E8CD8C" stroke-opacity="0.4" stroke-width="1"/>

    <!-- Web + Certifications small footer inside copy -->
    <text x="0" y="695" font-family="Inter, sans-serif" font-size="11" letter-spacing="4" fill="#E8CD8C" fill-opacity="0.72" font-weight="500">WEB</text>
    <text x="0" y="725" font-family="Cormorant Garamond, Georgia, serif" font-size="20" font-style="italic" fill="#E8CD8C">tequilatresese.com</text>

    <text x="0" y="795" font-family="Inter, sans-serif" font-size="11" letter-spacing="4" fill="#E8CD8C" fill-opacity="0.72" font-weight="500">CERTIFICACIONES</text>
    <text x="0" y="825" font-family="Cormorant Garamond, Georgia, serif" font-size="20" font-style="italic" fill="#FBF7EE" fill-opacity="0.9">USDA · UE · JAS · Bioagricert</text>
  </g>

  <!-- ─── RIGHT COLUMN · .contact-form (rendered as info card) ─── -->
  <g id="contact-form" transform="translate(1050, 220)">
    <!-- Card container -->
    <rect x="0" y="0" width="780" height="720" fill="#FBF7EE" fill-opacity="0.04" stroke="#E8CD8C" stroke-opacity="0.25" stroke-width="1" rx="4"/>

    <!-- Form header -->
    <text x="60" y="70" font-family="Inter, sans-serif" font-size="11" letter-spacing="4" fill="#E8CD8C" fill-opacity="0.72" font-weight="500">CÓMO PEDIR</text>
    <text x="60" y="130" font-family="Cormorant Garamond, Georgia, serif" font-size="36" font-weight="500" fill="#FBF7EE">Tres caminos hacia una <tspan font-style="italic" fill="#E8CD8C">botella</tspan>.</text>

    <line x1="60" y1="170" x2="720" y2="170" stroke="#E8CD8C" stroke-opacity="0.2" stroke-width="1"/>

    <!-- Row 1 — Tienda -->
    <text x="60" y="220" font-family="Cormorant Garamond, Georgia, serif" font-size="28" font-style="italic" font-weight="500" fill="#E8CD8C">01</text>
    <text x="130" y="215" font-family="Inter, sans-serif" font-size="10" letter-spacing="3" fill="#E8CD8C" fill-opacity="0.75" font-weight="500">DIRECTO — CONSUMIDOR</text>
    <text x="130" y="248" font-family="Cormorant Garamond, Georgia, serif" font-size="20" font-weight="500" fill="#FBF7EE">Tienda Tres Ese</text>
    <text x="130" y="276" font-family="Inter, sans-serif" font-size="13" fill="#FBF7EE" fill-opacity="0.75">tequila-tres-ese-tienda.myshopify.com</text>

    <line x1="60" y1="315" x2="720" y2="315" stroke="#E8CD8C" stroke-opacity="0.15" stroke-width="1"/>

    <!-- Row 2 — Distribuidores -->
    <text x="60" y="365" font-family="Cormorant Garamond, Georgia, serif" font-size="28" font-style="italic" font-weight="500" fill="#E8CD8C">02</text>
    <text x="130" y="360" font-family="Inter, sans-serif" font-size="10" letter-spacing="3" fill="#E8CD8C" fill-opacity="0.75" font-weight="500">MAYOREO — RESTAURANTES · HOTELES</text>
    <text x="130" y="393" font-family="Cormorant Garamond, Georgia, serif" font-size="20" font-weight="500" fill="#FBF7EE">Distribuidores y HORECA</text>
    <text x="130" y="421" font-family="Inter, sans-serif" font-size="13" fill="#FBF7EE" fill-opacity="0.75">+52 55 5292 8284 · pedidos y muestras</text>

    <line x1="60" y1="460" x2="720" y2="460" stroke="#E8CD8C" stroke-opacity="0.15" stroke-width="1"/>

    <!-- Row 3 — Prensa -->
    <text x="60" y="510" font-family="Cormorant Garamond, Georgia, serif" font-size="28" font-style="italic" font-weight="500" fill="#E8CD8C">03</text>
    <text x="130" y="505" font-family="Inter, sans-serif" font-size="10" letter-spacing="3" fill="#E8CD8C" fill-opacity="0.75" font-weight="500">PRENSA — MENCIÓN Y MUESTRA</text>
    <text x="130" y="538" font-family="Cormorant Garamond, Georgia, serif" font-size="20" font-weight="500" fill="#FBF7EE">Prensa y colaboraciones</text>
    <text x="130" y="566" font-family="Inter, sans-serif" font-size="13" fill="#FBF7EE" fill-opacity="0.75">cmir@tequilatresese.com · kits de prensa disponibles</text>

    <!-- Footer inside card -->
    <line x1="60" y1="620" x2="720" y2="620" stroke="#E8CD8C" stroke-opacity="0.2" stroke-width="1"/>
    <text x="60" y="670" font-family="Cormorant Garamond, Georgia, serif" font-size="18" font-style="italic" fill="#E8CD8C" fill-opacity="0.9">— Cinco generaciones, siempre a mano.</text>
  </g>


  <!-- QR to the microsite (bottom-right of the page) -->
  <g id="qr-badge" transform="translate(1700, 900)">
    <rect x="0" y="0" width="110" height="110" fill="#FBF7EE" rx="3"/>
    <image xlink:href="qr/qr-sitio-dark.png"
           x="7" y="7" width="96" height="96"
           preserveAspectRatio="xMidYMid meet"/>
  </g>

  <!-- Bottom brand strip -->
  <line x1="120" y1="990" x2="1800" y2="990" stroke="#E8CD8C" stroke-opacity="0.25" stroke-width="1"/>
  <text x="120" y="1030" font-family="Inter, sans-serif" font-size="10" letter-spacing="3.5" fill="#E8CD8C" fill-opacity="0.55">© 2026 TEQUILA TRES ESE</text>
  <text x="1800" y="1030" text-anchor="end" font-family="Inter, sans-serif" font-size="10" letter-spacing="3.5" fill="#E8CD8C" fill-opacity="0.55">HECHO EN MÉXICO</text>
</svg>
