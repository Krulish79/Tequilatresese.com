<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- ═══════════ SLIDE 06 · EL PROCESO ═══════════
       Mirrors the site's Proceso section — 5 step cards each with a real
       video-still photo at top and copy below. Cream/ivory background. -->

  <rect width="1920" height="1080" fill="#FBF7EE"/>

  <!-- Header -->
  <image xlink:href="../../images/Logos/logo-primary-black.png" x="120" y="88" width="90" height="60" preserveAspectRatio="xMinYMid meet"/>
  <text x="220" y="128" font-family="Cormorant Garamond, Georgia, serif" font-size="18" font-style="italic" fill="#2A2218">Tres Ese</text>
  <text x="1800" y="128" text-anchor="end" font-family="Inter, sans-serif" font-size="12" letter-spacing="4.5" fill="#8A4E1E">06 · EL PROCESO</text>
  <line x1="120" y1="160" x2="1800" y2="160" stroke="#C9B791" stroke-width="1"/>

  <!-- Eyebrow + title -->
  <g id="eyebrow">
    <line x1="120" y1="240" x2="180" y2="240" stroke="#8A4E1E" stroke-width="1.5"/>
    <text x="200" y="247" font-family="Inter, sans-serif" font-size="13" letter-spacing="5.5" fill="#8A4E1E" font-weight="500">CINCO PASOS</text>
  </g>
  <text x="120" y="335" font-family="Cormorant Garamond, Georgia, serif" font-size="72" font-weight="500" fill="#2A2218">De la <tspan font-style="italic" fill="#8A4E1E">tierra</tspan> a la botella.</text>
  <line x1="120" y1="378" x2="240" y2="378" stroke="#8A4E1E" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Clip paths for image containers (portrait 3:4 crops) -->
  <defs>
    <clipPath id="stepImg1"><rect x="120" y="430" width="325" height="380" rx="4"/></clipPath>
    <clipPath id="stepImg2"><rect x="465" y="430" width="325" height="380" rx="4"/></clipPath>
    <clipPath id="stepImg3"><rect x="810" y="430" width="325" height="380" rx="4"/></clipPath>
    <clipPath id="stepImg4"><rect x="1155" y="430" width="325" height="380" rx="4"/></clipPath>
    <clipPath id="stepImg5"><rect x="1500" y="430" width="325" height="380" rx="4"/></clipPath>
  </defs>

  <!-- ─── 5 STEP CARDS with real photos ─── -->

  <!-- STEP 01 · Cultivo -->
  <g id="step-01">
    <rect x="120" y="430" width="325" height="380" fill="#2A2218" rx="4"/>
    <image xlink:href="stills/cultivo-b.jpg" x="55" y="430" width="480" height="380" preserveAspectRatio="xMidYMid slice" clip-path="url(#stepImg1)"/>
    <text x="140" y="470" font-family="Cormorant Garamond, Georgia, serif" font-size="46" font-style="italic" font-weight="500" fill="#FBF7EE">01</text>
    <line x1="140" y1="486" x2="180" y2="486" stroke="#E8CD8C" stroke-width="1.5"/>
    <text x="140" y="500" font-family="Inter, sans-serif" font-size="10" letter-spacing="3.5" fill="#E8CD8C" font-weight="500">CULTIVO</text>

    <text x="120" y="855" font-family="Cormorant Garamond, Georgia, serif" font-size="24" font-weight="500" fill="#2A2218">Cultivo</text>
    <text x="120" y="885" font-family="Cormorant Garamond, Georgia, serif" font-size="17" font-style="italic" fill="#8A4E1E">Cosechado a mano.</text>
    <text x="120" y="930" font-family="Inter, sans-serif" font-size="13" fill="#584A38">
      <tspan x="120" dy="0">Campos a 2,030 m de altitud. Cultivo</tspan>
      <tspan x="120" dy="20">orgánico certificado. Los <tspan font-family="Cormorant Garamond, Georgia, serif" font-style="italic" font-size="14">jimadores</tspan></tspan>
      <tspan x="120" dy="20">cortan a mano, corazón por corazón.</tspan>
    </text>
  </g>

  <!-- STEP 02 · Cocción Lenta -->
  <g id="step-02">
    <rect x="465" y="430" width="325" height="380" fill="#2A2218" rx="4"/>
    <image xlink:href="stills/coccion-c.jpg" x="400" y="430" width="480" height="380" preserveAspectRatio="xMidYMid slice" clip-path="url(#stepImg2)"/>
    <text x="485" y="470" font-family="Cormorant Garamond, Georgia, serif" font-size="46" font-style="italic" font-weight="500" fill="#FBF7EE">02</text>
    <line x1="485" y1="486" x2="525" y2="486" stroke="#E8CD8C" stroke-width="1.5"/>
    <text x="485" y="500" font-family="Inter, sans-serif" font-size="10" letter-spacing="3.5" fill="#E8CD8C" font-weight="500">COCCIÓN</text>

    <text x="465" y="855" font-family="Cormorant Garamond, Georgia, serif" font-size="24" font-weight="500" fill="#2A2218">Cocción Lenta</text>
    <text x="465" y="885" font-family="Cormorant Garamond, Georgia, serif" font-size="17" font-style="italic" fill="#8A4E1E">Sin aditivos.</text>
    <text x="465" y="930" font-family="Inter, sans-serif" font-size="13" fill="#584A38">
      <tspan x="465" dy="0">Las <tspan font-family="Cormorant Garamond, Georgia, serif" font-style="italic" font-size="14">piñas</tspan> reposan en hornos</tspan>
      <tspan x="465" dy="20">tradicionales de mampostería.</tspan>
      <tspan x="465" dy="20">Calor bajo, azúcares naturales.</tspan>
    </text>
  </g>

  <!-- STEP 03 · Fermentación -->
  <g id="step-03">
    <rect x="810" y="430" width="325" height="380" fill="#2A2218" rx="4"/>
    <image xlink:href="stills/fermentacion-c.jpg" x="745" y="430" width="480" height="380" preserveAspectRatio="xMidYMid slice" clip-path="url(#stepImg3)"/>
    <text x="830" y="470" font-family="Cormorant Garamond, Georgia, serif" font-size="46" font-style="italic" font-weight="500" fill="#FBF7EE">03</text>
    <line x1="830" y1="486" x2="870" y2="486" stroke="#E8CD8C" stroke-width="1.5"/>
    <text x="830" y="500" font-family="Inter, sans-serif" font-size="10" letter-spacing="3.5" fill="#E8CD8C" font-weight="500">FERMENTACIÓN</text>

    <text x="810" y="855" font-family="Cormorant Garamond, Georgia, serif" font-size="24" font-weight="500" fill="#2A2218">Fermentación</text>
    <text x="810" y="885" font-family="Cormorant Garamond, Georgia, serif" font-size="17" font-style="italic" fill="#8A4E1E">Levaduras silvestres.</text>
    <text x="810" y="930" font-family="Inter, sans-serif" font-size="13" fill="#584A38">
      <tspan x="810" dy="0">Tinas abiertas de madera. Agua</tspan>
      <tspan x="810" dy="20">de pozo natural de 400 m. Solo</tspan>
      <tspan x="810" dy="20">levaduras nativas de la hacienda.</tspan>
    </text>
  </g>

  <!-- STEP 04 · Destilación -->
  <g id="step-04">
    <rect x="1155" y="430" width="325" height="380" fill="#2A2218" rx="4"/>
    <image xlink:href="../../images/slides/distillation/01.jpg" x="1090" y="430" width="480" height="380" preserveAspectRatio="xMidYMid slice" clip-path="url(#stepImg4)"/>
    <text x="1175" y="470" font-family="Cormorant Garamond, Georgia, serif" font-size="46" font-style="italic" font-weight="500" fill="#FBF7EE">04</text>
    <line x1="1175" y1="486" x2="1215" y2="486" stroke="#E8CD8C" stroke-width="1.5"/>
    <text x="1175" y="500" font-family="Inter, sans-serif" font-size="10" letter-spacing="3.5" fill="#E8CD8C" font-weight="500">DESTILACIÓN</text>

    <text x="1155" y="855" font-family="Cormorant Garamond, Georgia, serif" font-size="24" font-weight="500" fill="#2A2218">Destilación</text>
    <text x="1155" y="885" font-family="Cormorant Garamond, Georgia, serif" font-size="17" font-style="italic" fill="#8A4E1E">Alambiques de cobre.</text>
    <text x="1155" y="930" font-family="Inter, sans-serif" font-size="13" fill="#584A38">
      <tspan x="1155" dy="0">Doble destilación en alambiques</tspan>
      <tspan x="1155" dy="20">de cobre. El cobre pule los sabores.</tspan>
      <tspan x="1155" dy="20">Un destilado limpio.</tspan>
    </text>
  </g>

  <!-- STEP 05 · Reposo y Botella -->
  <g id="step-05">
    <rect x="1500" y="430" width="325" height="380" fill="#2A2218" rx="4"/>
    <image xlink:href="stills/embotellado-b.jpg" x="1435" y="430" width="480" height="380" preserveAspectRatio="xMidYMid slice" clip-path="url(#stepImg5)"/>
    <text x="1520" y="470" font-family="Cormorant Garamond, Georgia, serif" font-size="46" font-style="italic" font-weight="500" fill="#FBF7EE">05</text>
    <line x1="1520" y1="486" x2="1560" y2="486" stroke="#E8CD8C" stroke-width="1.5"/>
    <text x="1520" y="500" font-family="Inter, sans-serif" font-size="10" letter-spacing="3.5" fill="#E8CD8C" font-weight="500">EMBOTELLADO</text>

    <text x="1500" y="855" font-family="Cormorant Garamond, Georgia, serif" font-size="24" font-weight="500" fill="#2A2218">Reposo y Botella</text>
    <text x="1500" y="885" font-family="Cormorant Garamond, Georgia, serif" font-size="17" font-style="italic" fill="#8A4E1E">Numerado a mano.</text>
    <text x="1500" y="930" font-family="Inter, sans-serif" font-size="13" fill="#584A38">
      <tspan x="1500" dy="0">Blanco directo del alambique.</tspan>
      <tspan x="1500" dy="20">Reposado 6 meses en roble.</tspan>
      <tspan x="1500" dy="20">Extra Añejo 3+ años. A mano.</tspan>
    </text>
  </g>

  <!-- QR strip below the step cards linking to hosted videos -->
  <g id="qr-strip">
    <image xlink:href="qr/qr-cultivo-dark.png"    x="180" y="837" width="55" height="55"/>
    <image xlink:href="qr/qr-coccion-dark.png"    x="525" y="837" width="55" height="55"/>
    <image xlink:href="qr/qr-fermentacion-dark.png" x="870" y="837" width="55" height="55"/>
    <image xlink:href="qr/qr-sitio-dark.png"      x="1215" y="837" width="55" height="55"/>
    <image xlink:href="qr/qr-embotellado-dark.png" x="1560" y="837" width="55" height="55"/>
    <text x="250" y="878" font-family="Inter, sans-serif" font-size="9" letter-spacing="3" fill="#8A4E1E" font-weight="500">▶ VER VIDEO</text>
    <text x="595" y="878" font-family="Inter, sans-serif" font-size="9" letter-spacing="3" fill="#8A4E1E" font-weight="500">▶ VER VIDEO</text>
    <text x="940" y="878" font-family="Inter, sans-serif" font-size="9" letter-spacing="3" fill="#8A4E1E" font-weight="500">▶ VER VIDEO</text>
    <text x="1285" y="878" font-family="Inter, sans-serif" font-size="9" letter-spacing="3" fill="#8A4E1E" font-weight="500">▶ VER SITIO</text>
    <text x="1630" y="878" font-family="Inter, sans-serif" font-size="9" letter-spacing="3" fill="#8A4E1E" font-weight="500">▶ VER VIDEO</text>
  </g>

  <!-- Footer -->
  <line x1="120" y1="1010" x2="1800" y2="1010" stroke="#C9B791" stroke-width="1"/>
  <text x="120" y="1050" font-family="Inter, sans-serif" font-size="11" letter-spacing="3.5" fill="#8A7B62">DE LA TIERRA A LA BOTELLA</text>
  <text x="1800" y="1050" text-anchor="end" font-family="Inter, sans-serif" font-size="11" letter-spacing="3.5" fill="#8A7B62">PÁGINA 06</text>
</svg>
