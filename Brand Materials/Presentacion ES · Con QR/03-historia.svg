<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- ═══════════ SLIDE 03 · NUESTRA HISTORIA ═══════════
       Literal port of index.html <section class="story"> — split media/copy
       layout with the story photo on the LEFT and the site's exact copy
       block on the RIGHT (eyebrow → title → 2 paragraphs → signature →
       4 cert logos row). -->

  <defs>
    <clipPath id="storyClip"><rect x="90" y="90" width="820" height="900" rx="4"/></clipPath>
  </defs>

  <rect width="1920" height="1080" fill="#FBF7EE"/>

  <!-- ─── LEFT · story-media (portrait 4:5) ─── -->
  <g id="story-media">
    <rect x="90" y="90" width="820" height="900" fill="#2A2218" rx="4"/>
    <image xlink:href="stills/story-c.jpg"
           x="0" y="90" width="1000" height="900"
           preserveAspectRatio="xMidYMid slice"
           clip-path="url(#storyClip)"/>
    <!-- Caption ribbon at bottom -->
    <rect x="90" y="920" width="820" height="70" fill="#0F0C08" fill-opacity="0.55"/>
    <text x="120" y="960" font-family="Inter, sans-serif" font-size="12" letter-spacing="4" fill="#E8CD8C" font-weight="500">01 · NUESTRA HISTORIA</text>
    <text x="120" y="982" font-family="Cormorant Garamond, Georgia, serif" font-size="16" font-style="italic" fill="#FBF7EE">Los Altos de Jalisco · Desde 1905.</text>
  </g>

  <!-- ─── RIGHT · story-copy ─── -->
  <g id="story-copy" transform="translate(985, 130)">

    <!-- eyebrow -->
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="13" letter-spacing="5.5" fill="#8A4E1E" font-weight="500">NUESTRA HISTORIA</text>

    <!-- display-sm title (matches site's copy exactly) -->
    <text x="0" y="90" font-family="Cormorant Garamond, Georgia, serif" font-size="52" font-weight="500" fill="#2A2218">Certificado orgánico.</text>
    <text x="0" y="145" font-family="Cormorant Garamond, Georgia, serif" font-size="52" font-weight="500" fill="#2A2218"><tspan font-style="italic" fill="#8A4E1E">Cero aditivos.</tspan> Siempre.</text>

    <!-- Body copy — first paragraph -->
    <text x="0" y="230" font-family="Inter, sans-serif" font-size="16" fill="#584A38">
      <tspan x="0" dy="0">Durante cinco generaciones la familia <tspan font-weight="500" fill="#2A2218">Tres Ese</tspan> ha trabajado la tierra roja</tspan>
      <tspan x="0" dy="26">de Los Altos de Jalisco — sin herbicidas, sin fertilizantes sintéticos,</tspan>
      <tspan x="0" dy="26">sin atajos. Cada agave se cultiva de forma orgánica y se selecciona</tspan>
      <tspan x="0" dy="26">a mano en plena madurez, y luego se transforma lentamente en</tspan>
      <tspan x="0" dy="26">tequila por fuego, madera, cobre y tiempo.</tspan>
    </text>

    <!-- Body copy — second paragraph -->
    <text x="0" y="415" font-family="Inter, sans-serif" font-size="16" fill="#584A38">
      <tspan x="0" dy="0">Nada se añade en la botella. Sin azúcar. Sin glicerina. Sin</tspan>
      <tspan x="0" dy="26">saborizantes. Sin colorantes. Solo lo que la planta, la tierra y el</tspan>
      <tspan x="0" dy="26">sol de la sierra silenciosamente quisieron.</tspan>
    </text>

    <!-- signature -->
    <text x="0" y="560" font-family="Cormorant Garamond, Georgia, serif" font-size="22" font-style="italic" fill="#8A4E1E">— Familia Tres Ese</text>

    <!-- Divider before cert-logos -->
    <line x1="0" y1="620" x2="820" y2="620" stroke="#C9B791" stroke-width="1"/>

    <!-- Cert logos row (matches site's .cert-logos, 4 items in a row with name below icon) -->
    <text x="0" y="655" font-family="Inter, sans-serif" font-size="10" letter-spacing="4" fill="#8A4E1E" font-weight="500">CERTIFICACIONES ORGÁNICAS</text>

    <g transform="translate(0, 680)">
      <!-- USDA -->
      <image xlink:href="../../images/Organic Logos/usda.png" x="40" y="0" width="65" height="65" preserveAspectRatio="xMidYMid meet"/>
      <text x="72" y="95" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#584A38">USDA Orgánico</text>

      <!-- UE -->
      <image xlink:href="../../images/Organic Logos/eu.png" x="220" y="10" width="90" height="60" preserveAspectRatio="xMidYMid meet"/>
      <text x="265" y="95" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#584A38">UE Orgánico</text>

      <!-- JAS -->
      <image xlink:href="../../images/Organic Logos/jas.png" x="405" y="10" width="105" height="60" preserveAspectRatio="xMidYMid meet"/>
      <text x="457" y="95" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#584A38">JAS Estándar Orgánico</text>

      <!-- Bioagricert -->
      <image xlink:href="../../images/Organic Logos/bioagricert.png" x="595" y="25" width="180" height="35" preserveAspectRatio="xMidYMid meet"/>
      <text x="685" y="95" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#584A38">Certificación Orgánica</text>
    </g>

    <!-- QR badge — links to the story video hosted on tequilatresese.com -->
    <g id="qr-badge" transform="translate(680, 750)">
      <rect x="0" y="0" width="120" height="120" fill="#FFFFFF" stroke="#8A4E1E" stroke-width="1"/>
      <image xlink:href="qr/qr-historia-dark.png"
             x="8" y="8" width="104" height="104"
             preserveAspectRatio="xMidYMid meet"/>
      <text x="60" y="145" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" letter-spacing="3" fill="#8A4E1E" font-weight="500">▶ VER LA HISTORIA</text>
    </g>
  </g>
</svg>
