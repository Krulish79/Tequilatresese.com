<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- ═══════════ SLIDE 03 · NUESTRA HISTORIA ═══════════ -->

  <rect width="1920" height="1080" fill="#FBF7EE"/>

  <!-- Header -->
  <image xlink:href="../../images/Logos/logo-primary-black.png" x="120" y="88" width="90" height="60" preserveAspectRatio="xMinYMid meet"/>
  <text x="220" y="128" font-family="Cormorant Garamond, Georgia, serif" font-size="18" font-style="italic" fill="#2A2218">Tres Ese</text>
  <text x="1800" y="128" text-anchor="end" font-family="Inter, sans-serif" font-size="12" letter-spacing="4.5" fill="#8A4E1E">03 · LA HISTORIA</text>
  <line x1="120" y1="160" x2="1800" y2="160" stroke="#C9B791" stroke-width="1"/>

  <!-- Eyebrow -->
  <g id="eyebrow">
    <line x1="120" y1="245" x2="180" y2="245" stroke="#8A4E1E" stroke-width="1.5"/>
    <text x="200" y="252" font-family="Inter, sans-serif" font-size="14" letter-spacing="5.5" fill="#8A4E1E" font-weight="500">NUESTRA HISTORIA</text>
  </g>

  <!-- Big title -->
  <text x="120" y="360" font-family="Cormorant Garamond, Georgia, serif" font-size="82" font-weight="500" fill="#2A2218">Un siglo de <tspan font-style="italic" fill="#8A4E1E">tradición</tspan>,</text>
  <text x="120" y="440" font-family="Cormorant Garamond, Georgia, serif" font-size="82" font-weight="500" fill="#2A2218">siempre orgánico.</text>

  <!-- Copper rule -->
  <line x1="120" y1="480" x2="240" y2="480" stroke="#8A4E1E" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Two-column body — tightened positioning, aligned tops -->
  <g id="col-left" font-family="Inter, sans-serif" font-size="18" fill="#584A38">
    <text x="120" y="560">
      <tspan x="120" dy="0">En <tspan font-family="Cormorant Garamond, Georgia, serif" font-size="20" font-weight="500" fill="#2A2218">1905</tspan>, la familia <tspan font-family="Cormorant Garamond, Georgia, serif" font-size="20" font-weight="500" fill="#2A2218">Tres Ese</tspan> plantó su primer campo</tspan>
      <tspan x="120" dy="32">de agave azul en <tspan font-family="Cormorant Garamond, Georgia, serif" font-size="20" font-style="italic" fill="#2A2218">Los Altos de Jalisco</tspan> — a 2,030 metros</tspan>
      <tspan x="120" dy="32">sobre el nivel del mar, en tierra roja rica en hierro. Sin</tspan>
      <tspan x="120" dy="32">saber que un siglo después seguirían haciendo tequila</tspan>
      <tspan x="120" dy="32">con la misma paciencia, en el mismo suelo, con las</tspan>
      <tspan x="120" dy="32">mismas manos.</tspan>
    </text>
    <text x="120" y="800">
      <tspan x="120" dy="0">Cinco generaciones han pasado por la <tspan font-family="Cormorant Garamond, Georgia, serif" font-size="20" font-style="italic" fill="#2A2218">hacienda</tspan>. La</tspan>
      <tspan x="120" dy="32">sierra ha cambiado poco. La receta, nada.</tspan>
    </text>
  </g>

  <g id="col-right" font-family="Inter, sans-serif" font-size="18" fill="#584A38">
    <text x="1020" y="560">
      <tspan x="1020" dy="0">El agave se cosecha cuando está <tspan font-family="Cormorant Garamond, Georgia, serif" font-size="20" font-style="italic" fill="#2A2218">listo</tspan> — nunca antes.</tspan>
      <tspan x="1020" dy="32">Nuestros <tspan font-family="Cormorant Garamond, Georgia, serif" font-size="20" font-style="italic" fill="#2A2218">jimadores</tspan> cortan a mano, corazón por corazón,</tspan>
      <tspan x="1020" dy="32">como hicieron sus padres y abuelos. Es más lento.</tspan>
      <tspan x="1020" dy="32">Es más costoso. Y es la única forma que conocemos.</tspan>
    </text>
    <text x="1020" y="740">
      <tspan x="1020" dy="0">El resultado no es un tequila producido a escala. Es</tspan>
      <tspan x="1020" dy="32">un lote pequeño, numerado a mano, con la firma</tspan>
      <tspan x="1020" dy="32">silenciosa de la familia detrás.</tspan>
    </text>
    <text x="1020" y="900" font-family="Cormorant Garamond, Georgia, serif" font-size="26" font-style="italic" fill="#8A4E1E">— Familia Tres Ese</text>
  </g>

  <!-- QR badge — links to the story video hosted on tequilatresese.com -->
  <g id="qr-badge" transform="translate(1620, 810)">
    <rect x="0" y="0" width="180" height="180" fill="#FFFFFF" stroke="#8A4E1E" stroke-width="1"/>
    <image xlink:href="qr/qr-historia-dark.png"
           x="10" y="10" width="160" height="160"
           preserveAspectRatio="xMidYMid meet"/>
    <text x="90" y="215" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" letter-spacing="3.5" fill="#8A4E1E" font-weight="500">▶ VER LA HISTORIA</text>
    <text x="90" y="238" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="12" font-style="italic" fill="#584A38">Escanea con tu teléfono</text>
  </g>

  <!-- Footer -->
  <line x1="120" y1="1010" x2="1580" y2="1010" stroke="#C9B791" stroke-width="1"/>
  <text x="120" y="1050" font-family="Inter, sans-serif" font-size="11" letter-spacing="3.5" fill="#8A7B62">TEQUILA TRES ESE · DESDE 1905</text>
  <text x="1580" y="1050" text-anchor="end" font-family="Inter, sans-serif" font-size="11" letter-spacing="3.5" fill="#8A7B62">PÁGINA 03</text>
</svg>
