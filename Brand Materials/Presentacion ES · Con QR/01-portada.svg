<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1920 1080"
     width="1920" height="1080">

  <!-- ═══════════ SLIDE 01 · PORTADA ═══════════
       Literal port of the tequilatresese.com HERO section.
       Structure mirrors index.html's <section class="hero">:
         - Full-bleed hero-cellar backdrop (already contains the trio)
         - Left column .hero-copy: eyebrow → Tres Ese Orgánico → place → lede → stats
         - Right side kept clear so the bottles in the cellar image read
  -->

  <defs>
    <!-- Left-to-right scrim so text stays legible on the darker cellar bg
         but doesn't wash out the bottles on the right. -->
    <linearGradient id="leftScrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#0F0C08" stop-opacity="0.90"/>
      <stop offset="35%" stop-color="#0F0C08" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#0F0C08" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0F0C08" stop-opacity="0"/>
    </linearGradient>
    <!-- Subtle bottom fade to seat the stats row -->
    <linearGradient id="bottomFade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"  stop-color="#0F0C08" stop-opacity="0.55"/>
      <stop offset="20%" stop-color="#0F0C08" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ─── FULL-BLEED CELLAR BACKDROP ─── -->
  <image xlink:href="../../images/hero-cellar.jpg"
         x="0" y="0" width="1920" height="1080"
         preserveAspectRatio="xMidYMid slice"/>

  <!-- Left-side scrim for text legibility -->
  <rect width="1920" height="1080" fill="url(#leftScrim)"/>
  <rect width="1920" height="1080" fill="url(#bottomFade)"/>

  <!-- ─── LEFT COLUMN · .hero-copy ─── -->

  <!-- Small-caps eyebrow "TEQUILA" -->
  <text x="120" y="200"
        font-family="Inter, Helvetica, sans-serif"
        font-size="18" letter-spacing="9"
        fill="#E8CD8C" font-weight="500">TEQUILA</text>

  <!-- Big display: "Tres Ese" + italic "Orgánico" (2 lines) -->
  <text x="120" y="380"
        font-family="Cormorant Garamond, Georgia, serif"
        font-size="180" font-weight="500"
        fill="#FBF7EE" letter-spacing="-0.01em">Tres Ese</text>
  <text x="120" y="500"
        font-family="Cormorant Garamond, Georgia, serif"
        font-size="120" font-weight="400" font-style="italic"
        fill="#E8CD8C" letter-spacing="-0.005em">Orgánico</text>

  <!-- Place stamp -->
  <text x="120" y="580"
        font-family="Inter, Helvetica, sans-serif"
        font-size="15" letter-spacing="6"
        fill="#E8CD8C" fill-opacity="0.9" font-weight="500">DESDE 1905 · LOS ALTOS DE JALISCO</text>

  <!-- Lede paragraph -->
  <text x="120" y="675"
        font-family="Cormorant Garamond, Georgia, serif"
        font-size="26" font-style="italic"
        fill="#FBF7EE" fill-opacity="0.9">
    <tspan x="120" dy="0">100% agave azul, cultivado orgánicamente en la tierra</tspan>
    <tspan x="120" dy="40">roja de Los Altos de Jalisco. Nada añadido. Nada</tspan>
    <tspan x="120" dy="40">oculto. Solo agave, fuego, madera, cobre y tiempo.</tspan>
  </text>

  <!-- Divider line -->
  <line x1="120" y1="855" x2="960" y2="855"
        stroke="#E8CD8C" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Stats row · 4 items (100% agave azul · Orgánico cultivo · 2,030 metros altitud · Cero aditivos) -->
  <g id="stats" transform="translate(120, 920)">
    <!-- Item 1 -->
    <text x="0" y="0"
          font-family="Cormorant Garamond, Georgia, serif"
          font-size="30" font-style="italic" font-weight="500"
          fill="#FBF7EE">100%</text>
    <text x="0" y="42"
          font-family="Inter, sans-serif"
          font-size="10" letter-spacing="3.5"
          fill="#E8CD8C" fill-opacity="0.82" font-weight="500">AGAVE AZUL</text>

    <!-- Item 2 -->
    <text x="220" y="0"
          font-family="Cormorant Garamond, Georgia, serif"
          font-size="30" font-style="italic" font-weight="500"
          fill="#FBF7EE">Orgánico</text>
    <text x="220" y="42"
          font-family="Inter, sans-serif"
          font-size="10" letter-spacing="3.5"
          fill="#E8CD8C" fill-opacity="0.82" font-weight="500">CULTIVO</text>

    <!-- Item 3 -->
    <text x="440" y="0"
          font-family="Cormorant Garamond, Georgia, serif"
          font-size="30" font-style="italic" font-weight="500"
          fill="#FBF7EE">2,030 metros</text>
    <text x="440" y="42"
          font-family="Inter, sans-serif"
          font-size="10" letter-spacing="3.5"
          fill="#E8CD8C" fill-opacity="0.82" font-weight="500">ALTITUD</text>

    <!-- Item 4 -->
    <text x="740" y="0"
          font-family="Cormorant Garamond, Georgia, serif"
          font-size="30" font-style="italic" font-weight="500"
          fill="#FBF7EE">Cero</text>
    <text x="740" y="42"
          font-family="Inter, sans-serif"
          font-size="10" letter-spacing="3.5"
          fill="#E8CD8C" fill-opacity="0.82" font-weight="500">ADITIVOS</text>
  </g>

</svg>
