<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- ═══════════ SLIDE 05 · CERTIFICACIONES · DEEP-DIVE ═══════════
       Detailed breakdown of the 4 organic authorities that audit
       Tres Ese every year. Each cert gets a large card with its
       logo, formal name, governing standard, and what they verify.
       Complements slide 3 (which shows the certs briefly). -->

  <rect width="1920" height="1080" fill="#FBF7EE"/>

  <!-- section-head (centered, like site's other sections) -->
  <text x="960" y="105" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" letter-spacing="5.5" fill="#8A4E1E" font-weight="500">CERTIFICACIONES ORGÁNICAS</text>
  <text x="960" y="185" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="56" font-weight="500" fill="#2A2218"><tspan font-style="italic" fill="#8A4E1E">Auditados</tspan> por quienes más exigen.</text>
  <text x="960" y="235" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#584A38">Cuatro autoridades independientes verifican cada temporada, en campo y en botella.</text>

  <!-- 2×2 grid of cert deep-dive cards -->

  <!-- ─── CARD 01 · USDA ─── -->
  <g id="cert-usda" transform="translate(120, 300)">
    <rect x="0" y="0" width="820" height="330" fill="#FFFFFF" stroke="#C9B791" stroke-width="1" rx="6"/>
    <!-- Logo panel (left) -->
    <rect x="0" y="0" width="240" height="330" fill="#F4EEE2" rx="6"/>
    <image xlink:href="../../images/Organic Logos/usda.png" x="55" y="80" width="130" height="130" preserveAspectRatio="xMidYMid meet"/>
    <text x="120" y="255" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" letter-spacing="3.5" fill="#8A4E1E" font-weight="500">EE.UU. · USDA</text>
    <text x="120" y="278" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="13" font-style="italic" fill="#2A2218">Desde 1990</text>
    <!-- Content (right) -->
    <text x="275" y="55" font-family="Cormorant Garamond, Georgia, serif" font-size="32" font-weight="500" fill="#2A2218">USDA <tspan font-style="italic" fill="#8A4E1E">Orgánico</tspan></text>
    <text x="275" y="90" font-family="Inter, sans-serif" font-size="11" letter-spacing="3" fill="#8A4E1E" font-weight="500">USDA NATIONAL ORGANIC PROGRAM (NOP)</text>
    <line x1="275" y1="115" x2="750" y2="115" stroke="#C9B791" stroke-width="0.5"/>
    <text x="275" y="150" font-family="Inter, sans-serif" font-size="13" fill="#584A38">
      <tspan x="275" dy="0">La norma federal estadounidense para agricultura y</tspan>
      <tspan x="275" dy="22">producción orgánica. Verifica que el agave se cultive</tspan>
      <tspan x="275" dy="22">sin pesticidas, herbicidas ni fertilizantes sintéticos, y</tspan>
      <tspan x="275" dy="22">que la destilería opere sin aditivos permitidos por NOM.</tspan>
    </text>
    <text x="275" y="280" font-family="Inter, sans-serif" font-size="10" letter-spacing="3" fill="#8A4E1E" font-weight="500" fill-opacity="0.85">AUDITORÍA</text>
    <text x="275" y="305" font-family="Cormorant Garamond, Georgia, serif" font-size="14" font-style="italic" fill="#2A2218">Anual · en campo y en destilería · lote a lote</text>
  </g>

  <!-- ─── CARD 02 · UE ─── -->
  <g id="cert-eu" transform="translate(980, 300)">
    <rect x="0" y="0" width="820" height="330" fill="#FFFFFF" stroke="#C9B791" stroke-width="1" rx="6"/>
    <rect x="0" y="0" width="240" height="330" fill="#F4EEE2" rx="6"/>
    <image xlink:href="../../images/Organic Logos/eu.png" x="45" y="105" width="150" height="90" preserveAspectRatio="xMidYMid meet"/>
    <text x="120" y="255" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" letter-spacing="3.5" fill="#8A4E1E" font-weight="500">UNIÓN EUROPEA</text>
    <text x="120" y="278" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="13" font-style="italic" fill="#2A2218">Desde 1991</text>
    <text x="275" y="55" font-family="Cormorant Garamond, Georgia, serif" font-size="32" font-weight="500" fill="#2A2218">UE <tspan font-style="italic" fill="#8A4E1E">Orgánico</tspan></text>
    <text x="275" y="90" font-family="Inter, sans-serif" font-size="11" letter-spacing="3" fill="#8A4E1E" font-weight="500">REGLAMENTO (UE) 2018/848</text>
    <line x1="275" y1="115" x2="750" y2="115" stroke="#C9B791" stroke-width="0.5"/>
    <text x="275" y="150" font-family="Inter, sans-serif" font-size="13" fill="#584A38">
      <tspan x="275" dy="0">Norma comunitaria europea con la Eurohoja verde.</tspan>
      <tspan x="275" dy="22">Exige trazabilidad completa desde el campo, prohibe</tspan>
      <tspan x="275" dy="22">OGM y aditivos sintéticos, y garantiza el bienestar</tspan>
      <tspan x="275" dy="22">del cultivo — todo bajo inspección oficial anual.</tspan>
    </text>
    <text x="275" y="280" font-family="Inter, sans-serif" font-size="10" letter-spacing="3" fill="#8A4E1E" font-weight="500" fill-opacity="0.85">AUDITORÍA</text>
    <text x="275" y="305" font-family="Cormorant Garamond, Georgia, serif" font-size="14" font-style="italic" fill="#2A2218">Anual · trazabilidad completa · certificado por lote</text>
  </g>

  <!-- ─── CARD 03 · JAS ─── -->
  <g id="cert-jas" transform="translate(120, 660)">
    <rect x="0" y="0" width="820" height="330" fill="#FFFFFF" stroke="#C9B791" stroke-width="1" rx="6"/>
    <rect x="0" y="0" width="240" height="330" fill="#F4EEE2" rx="6"/>
    <image xlink:href="../../images/Organic Logos/jas.png" x="45" y="95" width="150" height="115" preserveAspectRatio="xMidYMid meet"/>
    <text x="120" y="255" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" letter-spacing="3.5" fill="#8A4E1E" font-weight="500">JAPÓN · MAFF</text>
    <text x="120" y="278" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="13" font-style="italic" fill="#2A2218">Desde 2000</text>
    <text x="275" y="55" font-family="Cormorant Garamond, Georgia, serif" font-size="32" font-weight="500" fill="#2A2218">JAS <tspan font-style="italic" fill="#8A4E1E">Estándar Orgánico</tspan></text>
    <text x="275" y="90" font-family="Inter, sans-serif" font-size="11" letter-spacing="3" fill="#8A4E1E" font-weight="500">JAPANESE AGRICULTURAL STANDARD</text>
    <line x1="275" y1="115" x2="750" y2="115" stroke="#C9B791" stroke-width="0.5"/>
    <text x="275" y="150" font-family="Inter, sans-serif" font-size="13" fill="#584A38">
      <tspan x="275" dy="0">La norma orgánica más estricta de Asia. Regulada por</tspan>
      <tspan x="275" dy="22">el Ministerio de Agricultura de Japón (MAFF), exige</tspan>
      <tspan x="275" dy="22">documentación exhaustiva de cada etapa productiva</tspan>
      <tspan x="275" dy="22">y prohíbe categóricamente cualquier residuo químico.</tspan>
    </text>
    <text x="275" y="280" font-family="Inter, sans-serif" font-size="10" letter-spacing="3" fill="#8A4E1E" font-weight="500" fill-opacity="0.85">AUDITORÍA</text>
    <text x="275" y="305" font-family="Cormorant Garamond, Georgia, serif" font-size="14" font-style="italic" fill="#2A2218">Anual · con inspección física y análisis de residuos</text>
  </g>

  <!-- ─── CARD 04 · BIOAGRICERT ─── -->
  <g id="cert-bio" transform="translate(980, 660)">
    <rect x="0" y="0" width="820" height="330" fill="#FFFFFF" stroke="#C9B791" stroke-width="1" rx="6"/>
    <rect x="0" y="0" width="240" height="330" fill="#F4EEE2" rx="6"/>
    <image xlink:href="../../images/Organic Logos/bioagricert.png" x="30" y="130" width="180" height="55" preserveAspectRatio="xMidYMid meet"/>
    <text x="120" y="255" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" letter-spacing="3.5" fill="#8A4E1E" font-weight="500">ITALIA · GLOBAL</text>
    <text x="120" y="278" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="13" font-style="italic" fill="#2A2218">Desde 1984</text>
    <text x="275" y="55" font-family="Cormorant Garamond, Georgia, serif" font-size="32" font-weight="500" fill="#2A2218">Bioagricert <tspan font-style="italic" fill="#8A4E1E">Orgánico</tspan></text>
    <text x="275" y="90" font-family="Inter, sans-serif" font-size="11" letter-spacing="3" fill="#8A4E1E" font-weight="500">ORGANISMO CERTIFICADOR INTERNACIONAL</text>
    <line x1="275" y1="115" x2="750" y2="115" stroke="#C9B791" stroke-width="0.5"/>
    <text x="275" y="150" font-family="Inter, sans-serif" font-size="13" fill="#584A38">
      <tspan x="275" dy="0">Certificadora italiana con acreditación internacional</tspan>
      <tspan x="275" dy="22">para verificar cumplimiento de las normas UE, USDA</tspan>
      <tspan x="275" dy="22">y JAS. Actúa como el auditor de campo que integra</tspan>
      <tspan x="275" dy="22">las tres normas anteriores en una sola trazabilidad.</tspan>
    </text>
    <text x="275" y="280" font-family="Inter, sans-serif" font-size="10" letter-spacing="3" fill="#8A4E1E" font-weight="500" fill-opacity="0.85">AUDITORÍA</text>
    <text x="275" y="305" font-family="Cormorant Garamond, Georgia, serif" font-size="14" font-style="italic" fill="#2A2218">Auditor de campo · valida las 3 normas simultáneamente</text>
  </g>
</svg>
