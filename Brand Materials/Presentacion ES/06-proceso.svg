<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- ═══════════ SLIDE 06 · EL PROCESO · STEP 01 CULTIVO ═══════════
       Literal port of one <article class="step"> from the site's
       Proceso section — split media LEFT / copy RIGHT layout.
       This is the LAYOUT TEMPLATE. The other 4 steps (Cocción,
       Fermentación, Destilación, Embotellado) will use the same
       structure with media alternating LEFT/RIGHT like on the site.
       Photo placeholder — brand-owner will supply better imagery.
  -->

  <defs>
    <clipPath id="stepMediaClip"><rect x="90" y="90" width="840" height="900" rx="4"/></clipPath>
  </defs>

  <rect width="1920" height="1080" fill="#FBF7EE"/>

  <!-- ─── LEFT · step-media (portrait 4:5 with atmospheric overlay) ─── -->
  <g id="step-media">
    <rect x="90" y="90" width="840" height="900" fill="#2A2218" rx="4"/>
    <image xlink:href="stills/cultivo-b.jpg"
           x="0" y="90" width="1000" height="900"
           preserveAspectRatio="xMidYMid slice"
           clip-path="url(#stepMediaClip)"/>
    <!-- Bottom overlay ribbon with big step number -->
    <rect x="90" y="820" width="840" height="170" fill="#0F0C08" fill-opacity="0.6"/>
    <text x="130" y="920" font-family="Cormorant Garamond, Georgia, serif" font-size="98" font-style="italic" font-weight="500" fill="#E8CD8C">01</text>
    <line x1="260" y1="880" x2="380" y2="880" stroke="#E8CD8C" stroke-width="1"/>
    <text x="260" y="925" font-family="Inter, sans-serif" font-size="11" letter-spacing="4" fill="#E8CD8C" font-weight="500">EL PROCESO · PASO 01</text>
    <text x="260" y="962" font-family="Cormorant Garamond, Georgia, serif" font-size="22" font-style="italic" fill="#FBF7EE">Campos de Los Altos de Jalisco.</text>
  </g>

  <!-- ─── RIGHT · step-copy ─── -->
  <g id="step-copy" transform="translate(1010, 200)">
    <!-- step-num (site: "01 — Cultivo") -->
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="14" letter-spacing="5" fill="#8A4E1E" font-weight="500">01 — CULTIVO</text>

    <!-- display-xs headline (matches site copy exactly, italic emphasis on 'Cosechado a mano') -->
    <text x="0" y="110" font-family="Cormorant Garamond, Georgia, serif" font-size="54" font-weight="500" fill="#2A2218">Cultivado en la sierra</text>
    <text x="0" y="170" font-family="Cormorant Garamond, Georgia, serif" font-size="54" font-weight="500" fill="#2A2218">a 2,030 metros.</text>
    <text x="0" y="240" font-family="Cormorant Garamond, Georgia, serif" font-size="54" font-weight="500" font-style="italic" fill="#8A4E1E">Cosechado a mano.</text>

    <!-- Copper rule -->
    <line x1="0" y1="290" x2="120" y2="290" stroke="#8A4E1E" stroke-opacity="0.6" stroke-width="1"/>

    <!-- Body copy — paragraph 1 (matches site) -->
    <text x="0" y="360" font-family="Inter, sans-serif" font-size="17" fill="#584A38">
      <tspan x="0" dy="0">Nuestros campos descansan en lo alto de Los Altos de</tspan>
      <tspan x="0" dy="28">Jalisco, donde la tierra roja rica en hierro y las noches</tspan>
      <tspan x="0" dy="28">frescas de la sierra extraen entre seis y ocho años de</tspan>
      <tspan x="0" dy="28">dulzura lenta y paciente en cada agave azul orgánico</tspan>
      <tspan x="0" dy="28">(<tspan font-family="Cormorant Garamond, Georgia, serif" font-style="italic" font-size="19" fill="#2A2218">tequilana</tspan>). Sin pesticidas. Sin insumos sintéticos.</tspan>
      <tspan x="0" dy="28">Solo composta natural y el sol de la sierra.</tspan>
    </text>

    <!-- Body copy — paragraph 2 -->
    <text x="0" y="590" font-family="Inter, sans-serif" font-size="17" fill="#584A38">
      <tspan x="0" dy="0">Cuando la planta está lista — y ni una temporada antes —</tspan>
      <tspan x="0" dy="28">nuestros <tspan font-family="Cormorant Garamond, Georgia, serif" font-style="italic" font-size="19" fill="#2A2218">jimadores</tspan> cortan a mano, corazón por corazón,</tspan>
      <tspan x="0" dy="28">como hicieron sus padres antes que ellos.</tspan>
    </text>
  </g>

  <!-- Section-index footer strip: shows this is step 01 of 05 -->
  <line x1="1010" y1="820" x2="1830" y2="820" stroke="#C9B791" stroke-width="1"/>
  <g id="step-nav" transform="translate(1010, 850)">
    <!-- Current step highlighted -->
    <g transform="translate(0,0)">
      <text x="0" y="18" font-family="Cormorant Garamond, Georgia, serif" font-size="22" font-style="italic" font-weight="500" fill="#8A4E1E">01</text>
      <text x="0" y="42" font-family="Inter, sans-serif" font-size="9" letter-spacing="2.5" fill="#8A4E1E" font-weight="500">CULTIVO</text>
    </g>
    <g transform="translate(160,0)">
      <text x="0" y="18" font-family="Cormorant Garamond, Georgia, serif" font-size="22" font-style="italic" font-weight="500" fill="#8A7B62" opacity="0.5">02</text>
      <text x="0" y="42" font-family="Inter, sans-serif" font-size="9" letter-spacing="2.5" fill="#8A7B62" opacity="0.6" font-weight="500">COCCIÓN</text>
    </g>
    <g transform="translate(320,0)">
      <text x="0" y="18" font-family="Cormorant Garamond, Georgia, serif" font-size="22" font-style="italic" font-weight="500" fill="#8A7B62" opacity="0.5">03</text>
      <text x="0" y="42" font-family="Inter, sans-serif" font-size="9" letter-spacing="2.5" fill="#8A7B62" opacity="0.6" font-weight="500">FERMENTACIÓN</text>
    </g>
    <g transform="translate(500,0)">
      <text x="0" y="18" font-family="Cormorant Garamond, Georgia, serif" font-size="22" font-style="italic" font-weight="500" fill="#8A7B62" opacity="0.5">04</text>
      <text x="0" y="42" font-family="Inter, sans-serif" font-size="9" letter-spacing="2.5" fill="#8A7B62" opacity="0.6" font-weight="500">DESTILACIÓN</text>
    </g>
    <g transform="translate(670,0)">
      <text x="0" y="18" font-family="Cormorant Garamond, Georgia, serif" font-size="22" font-style="italic" font-weight="500" fill="#8A7B62" opacity="0.5">05</text>
      <text x="0" y="42" font-family="Inter, sans-serif" font-size="9" letter-spacing="2.5" fill="#8A7B62" opacity="0.6" font-weight="500">EMBOTELLADO</text>
    </g>
  </g>
</svg>
