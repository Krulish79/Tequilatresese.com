<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- ═══════════ SLIDE 04 · LA DIFERENCIA ═══════════ -->

  <rect width="1920" height="1080" fill="#3D2E1F"/>

  <!-- Header -->
  <image xlink:href="../../images/Logos/logo-primary-white.png" x="120" y="88" width="90" height="60" preserveAspectRatio="xMinYMid meet"/>
  <text x="220" y="128" font-family="Cormorant Garamond, Georgia, serif" font-size="18" font-style="italic" fill="#FBF7EE">Tres Ese</text>
  <text x="1800" y="128" text-anchor="end" font-family="Inter, sans-serif" font-size="12" letter-spacing="4.5" fill="#E8CD8C">04 · LA DIFERENCIA</text>
  <line x1="120" y1="160" x2="1800" y2="160" stroke="#E8CD8C" stroke-opacity="0.24" stroke-width="1"/>

  <!-- Eyebrow + title -->
  <g id="eyebrow">
    <line x1="120" y1="245" x2="180" y2="245" stroke="#E8CD8C" stroke-width="1.5"/>
    <text x="200" y="252" font-family="Inter, sans-serif" font-size="14" letter-spacing="5.5" fill="#E8CD8C" font-weight="500">LA DIFERENCIA</text>
  </g>
  <text x="120" y="380" font-family="Cormorant Garamond, Georgia, serif" font-size="88" font-weight="500" fill="#FBF7EE">Por qué somos <tspan font-style="italic" fill="#E8CD8C">distintos</tspan>.</text>
  <line x1="120" y1="435" x2="270" y2="435" stroke="#E8CD8C" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Lede -->
  <text x="120" y="530" font-family="Cormorant Garamond, Georgia, serif" font-size="22" fill="#FBF7EE" fill-opacity="0.9">
    <tspan x="120" dy="0">La mayoría del tequila en el mundo — incluyendo etiquetas <tspan font-style="italic" fill="#E8CD8C">premium</tspan> — se produce con agave cultivado con químicos,</tspan>
    <tspan x="120" dy="34">y se termina en botella con azúcares, glicerina, colorantes y saborizantes permitidos por norma. Nosotros elegimos otra cosa.</tspan>
  </text>

  <!-- 4 stat cards horizontal -->
  <g id="stat-01" transform="translate(120, 660)">
    <line x1="0" y1="0" x2="380" y2="0" stroke="#E8CD8C" stroke-opacity="0.28" stroke-width="1"/>
    <text x="0" y="90" font-family="Cormorant Garamond, Georgia, serif" font-size="72" font-style="italic" font-weight="500" fill="#E8CD8C">100%</text>
    <text x="0" y="140" font-family="Inter, sans-serif" font-size="13" letter-spacing="4.5" fill="#E8CD8C" fill-opacity="0.85">AGAVE AZUL</text>
    <text x="0" y="180" font-family="Inter, sans-serif" font-size="15" fill="#FBF7EE" fill-opacity="0.75">
      <tspan x="0" dy="0">Un solo ingrediente:</tspan>
      <tspan x="0" dy="24"><tspan font-family="Cormorant Garamond, Georgia, serif" font-style="italic" font-size="17">Agave tequilana.</tspan></tspan>
      <tspan x="0" dy="24">Sin mezclas, sin diluyentes.</tspan>
    </text>
  </g>

  <g id="stat-02" transform="translate(540, 660)">
    <line x1="0" y1="0" x2="380" y2="0" stroke="#E8CD8C" stroke-opacity="0.28" stroke-width="1"/>
    <text x="0" y="90" font-family="Cormorant Garamond, Georgia, serif" font-size="72" font-style="italic" font-weight="500" fill="#E8CD8C">Cero</text>
    <text x="0" y="140" font-family="Inter, sans-serif" font-size="13" letter-spacing="4.5" fill="#E8CD8C" fill-opacity="0.85">ADITIVOS</text>
    <text x="0" y="180" font-family="Inter, sans-serif" font-size="15" fill="#FBF7EE" fill-opacity="0.75">
      <tspan x="0" dy="0">Sin azúcares, sin glicerina,</tspan>
      <tspan x="0" dy="24">sin saborizantes, sin</tspan>
      <tspan x="0" dy="24">colorantes en la botella.</tspan>
    </text>
  </g>

  <g id="stat-03" transform="translate(960, 660)">
    <line x1="0" y1="0" x2="380" y2="0" stroke="#E8CD8C" stroke-opacity="0.28" stroke-width="1"/>
    <text x="0" y="90" font-family="Cormorant Garamond, Georgia, serif" font-size="72" font-style="italic" font-weight="500" fill="#E8CD8C">Orgánico</text>
    <text x="0" y="140" font-family="Inter, sans-serif" font-size="13" letter-spacing="4.5" fill="#E8CD8C" fill-opacity="0.85">DE CAMPO A BOTELLA</text>
    <text x="0" y="180" font-family="Inter, sans-serif" font-size="15" fill="#FBF7EE" fill-opacity="0.75">
      <tspan x="0" dy="0">Sin herbicidas,</tspan>
      <tspan x="0" dy="24">sin fertilizantes sintéticos,</tspan>
      <tspan x="0" dy="24">sin pesticidas en el cultivo.</tspan>
    </text>
  </g>

  <g id="stat-04" transform="translate(1380, 660)">
    <line x1="0" y1="0" x2="380" y2="0" stroke="#E8CD8C" stroke-opacity="0.28" stroke-width="1"/>
    <text x="0" y="90" font-family="Cormorant Garamond, Georgia, serif" font-size="72" font-style="italic" font-weight="500" fill="#E8CD8C">Lotes</text>
    <text x="0" y="140" font-family="Inter, sans-serif" font-size="13" letter-spacing="4.5" fill="#E8CD8C" fill-opacity="0.85">PEQUEÑOS · HECHO A MANO</text>
    <text x="0" y="180" font-family="Inter, sans-serif" font-size="15" fill="#FBF7EE" fill-opacity="0.75">
      <tspan x="0" dy="0">Cada botella numerada.</tspan>
      <tspan x="0" dy="24">Producción limitada,</tspan>
      <tspan x="0" dy="24">sin escala industrial.</tspan>
    </text>
  </g>

  <!-- Footer -->
  <line x1="120" y1="1010" x2="1800" y2="1010" stroke="#E8CD8C" stroke-opacity="0.24" stroke-width="1"/>
  <text x="120" y="1050" font-family="Inter, sans-serif" font-size="11" letter-spacing="3.5" fill="#E8CD8C" fill-opacity="0.7">CERO ADITIVOS · SIEMPRE</text>
  <text x="1800" y="1050" text-anchor="end" font-family="Inter, sans-serif" font-size="11" letter-spacing="3.5" fill="#E8CD8C" fill-opacity="0.7">PÁGINA 04</text>
</svg>
