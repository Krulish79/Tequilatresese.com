<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- ═══════════ SLIDE 07 · LAS EXPRESIONES ═══════════
       Literal port of index.html <section class="expressions"> —
       centered section-head + 3 expression cards side-by-side each with
       num-tag, bottle image on beige spotlight, tag, title, body copy,
       and spec pills at the bottom. -->

  <defs>
    <radialGradient id="beigeSpot1" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#EDE3D0"/>
      <stop offset="70%" stop-color="#E0D2B0"/>
      <stop offset="100%" stop-color="#C9B791"/>
    </radialGradient>
    <radialGradient id="beigeSpot2" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#EFE0BE"/>
      <stop offset="70%" stop-color="#D8C9AC"/>
      <stop offset="100%" stop-color="#B8A280"/>
    </radialGradient>
    <radialGradient id="beigeSpot3" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#DDC79A"/>
      <stop offset="70%" stop-color="#B89666"/>
      <stop offset="100%" stop-color="#8A6E42"/>
    </radialGradient>
    <filter id="bottleShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="12" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#FBF7EE"/>

  <!-- ─── section-head (centered, mirrors site) ─── -->
  <text x="960" y="100" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" letter-spacing="5.5" fill="#8A4E1E" font-weight="500">TRES EXPRESIONES</text>
  <text x="960" y="175" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="52" font-weight="500" fill="#2A2218">Un agave, <tspan font-style="italic" fill="#8A4E1E">tres momentos</tspan> en el tiempo.</text>
  <text x="960" y="220" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#584A38">Mismo agave, hornos de mampostería y alambiques de cobre — solo el tiempo en el roble los distingue.</text>

  <!-- ─── EXPRESIÓN 01 · Blanco Orgánico ─── -->
  <g id="exp-01" transform="translate(60, 275)">
    <rect x="0" y="0" width="600" height="740" fill="url(#beigeSpot1)" rx="6"/>
    <!-- num-tag -->
    <rect x="20" y="20" width="70" height="30" fill="#0F0C08" fill-opacity="0.72" rx="2"/>
    <text x="55" y="41" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" letter-spacing="3" fill="#E8CD8C" font-weight="500">Nº 01</text>
    <!-- bottle -->
    <image xlink:href="../../images/TresEse_Botella_Blanco.png" x="100" y="30" width="400" height="380" preserveAspectRatio="xMidYMax meet" filter="url(#bottleShadow)"/>
    <line x1="60" y1="430" x2="540" y2="430" stroke="#8A4E1E" stroke-opacity="0.35" stroke-width="1"/>
    <!-- tag -->
    <text x="300" y="470" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" letter-spacing="4.5" fill="#8A4E1E" font-weight="500">TEQUILA ORGÁNICO</text>
    <!-- title -->
    <text x="300" y="518" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="36" font-weight="500" fill="#2A2218">Blanco <tspan font-style="italic" fill="#8A4E1E">Orgánico</tspan></text>
    <!-- body copy -->
    <text x="300" y="565" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#2A2218" fill-opacity="0.8">
      <tspan x="300" dy="0">La voz más pura del agave — cristalino,</tspan>
      <tspan x="300" dy="18">mineral, embotellado directo del alambique.</tspan>
      <tspan x="300" dy="18">Nada oculto por la barrica.</tspan>
    </text>
    <!-- spec pills (mirror site's spec-pills) -->
    <g transform="translate(40, 640)">
      <rect x="0" y="0" width="80" height="45" fill="#FBF7EE" stroke="#8A4E1E" stroke-opacity="0.32" rx="2"/>
      <text x="40" y="18" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" letter-spacing="1.5" fill="#8A4E1E" font-weight="500">VOL ALC</text>
      <text x="40" y="35" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="13" font-weight="500" fill="#2A2218">40.4%</text>

      <rect x="90" y="0" width="80" height="45" fill="#2A2218" rx="2"/>
      <text x="130" y="18" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" letter-spacing="1.5" fill="#E8CD8C" font-weight="500">GRADOS</text>
      <text x="130" y="35" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="13" font-weight="500" fill="#FBF7EE">80.8</text>

      <rect x="180" y="0" width="120" height="45" fill="#FBF7EE" stroke="#8A4E1E" stroke-opacity="0.32" rx="2"/>
      <text x="240" y="18" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" letter-spacing="1.5" fill="#8A4E1E" font-weight="500">REPOSO</text>
      <text x="240" y="35" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="12" font-weight="500" fill="#2A2218">Sin reposo</text>

      <rect x="310" y="0" width="90" height="45" fill="#FBF7EE" stroke="#8A4E1E" stroke-opacity="0.32" rx="2"/>
      <text x="355" y="18" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" letter-spacing="1.5" fill="#8A4E1E" font-weight="500">COLOR</text>
      <text x="355" y="35" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="12" font-weight="500" fill="#2A2218">Cristal</text>

      <rect x="410" y="0" width="110" height="45" fill="#FBF7EE" stroke="#8A4E1E" stroke-opacity="0.32" rx="2"/>
      <text x="465" y="18" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" letter-spacing="1.5" fill="#8A4E1E" font-weight="500">SERVIR</text>
      <text x="465" y="35" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="10" font-weight="500" fill="#2A2218">Solo · hielo</text>
    </g>
  </g>

  <!-- ─── EXPRESIÓN 02 · Reposado Orgánico ─── -->
  <g id="exp-02" transform="translate(680, 275)">
    <rect x="0" y="0" width="600" height="740" fill="url(#beigeSpot2)" rx="6"/>
    <rect x="20" y="20" width="70" height="30" fill="#0F0C08" fill-opacity="0.72" rx="2"/>
    <text x="55" y="41" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" letter-spacing="3" fill="#E8CD8C" font-weight="500">Nº 02</text>
    <image xlink:href="../../images/TresEse_Botella_Reposado.png" x="100" y="30" width="400" height="380" preserveAspectRatio="xMidYMax meet" filter="url(#bottleShadow)"/>
    <line x1="60" y1="430" x2="540" y2="430" stroke="#8A4E1E" stroke-opacity="0.35" stroke-width="1"/>
    <text x="300" y="470" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" letter-spacing="4.5" fill="#8A4E1E" font-weight="500">TEQUILA ORGÁNICO</text>
    <text x="300" y="518" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="36" font-weight="500" fill="#2A2218">Reposado <tspan font-style="italic" fill="#8A4E1E">Orgánico</tspan></text>
    <text x="300" y="565" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#2A2218" fill-opacity="0.8">
      <tspan x="300" dy="0">Seis meses en roble francés. Tostado,</tspan>
      <tspan x="300" dy="18">horneado, paciente. Con una sombra</tspan>
      <tspan x="300" dy="18">silenciosa de madera.</tspan>
    </text>
    <g transform="translate(40, 640)">
      <rect x="0" y="0" width="80" height="45" fill="#FBF7EE" stroke="#8A4E1E" stroke-opacity="0.32" rx="2"/>
      <text x="40" y="18" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" letter-spacing="1.5" fill="#8A4E1E" font-weight="500">VOL ALC</text>
      <text x="40" y="35" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="13" font-weight="500" fill="#2A2218">43.4%</text>

      <rect x="90" y="0" width="80" height="45" fill="#2A2218" rx="2"/>
      <text x="130" y="18" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" letter-spacing="1.5" fill="#E8CD8C" font-weight="500">GRADOS</text>
      <text x="130" y="35" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="13" font-weight="500" fill="#FBF7EE">86.8</text>

      <rect x="180" y="0" width="180" height="45" fill="#FBF7EE" stroke="#8A4E1E" stroke-opacity="0.32" rx="2"/>
      <text x="270" y="18" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" letter-spacing="1.5" fill="#8A4E1E" font-weight="500">REPOSO</text>
      <text x="270" y="35" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="11" font-weight="500" fill="#2A2218">6 meses · roble francés</text>

      <rect x="370" y="0" width="150" height="45" fill="#FBF7EE" stroke="#8A4E1E" stroke-opacity="0.32" rx="2"/>
      <text x="445" y="18" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" letter-spacing="1.5" fill="#8A4E1E" font-weight="500">COLOR</text>
      <text x="445" y="35" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="11" font-weight="500" fill="#2A2218">Oro pajizo claro</text>
    </g>
  </g>

  <!-- ─── EXPRESIÓN 03 · Extra Añejo ─── -->
  <g id="exp-03" transform="translate(1300, 275)">
    <rect x="0" y="0" width="600" height="740" fill="url(#beigeSpot3)" rx="6"/>
    <rect x="20" y="20" width="70" height="30" fill="#FBF7EE" fill-opacity="0.85" rx="2"/>
    <text x="55" y="41" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" letter-spacing="3" fill="#2A2218" font-weight="500">Nº 03</text>
    <image xlink:href="../../images/TresEse_Botella_ExtraA&#xF1;ejo.png" x="100" y="30" width="400" height="380" preserveAspectRatio="xMidYMax meet" filter="url(#bottleShadow)"/>
    <line x1="60" y1="430" x2="540" y2="430" stroke="#FBF7EE" stroke-opacity="0.5" stroke-width="1"/>
    <text x="300" y="470" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" letter-spacing="4.5" fill="#FBF7EE" font-weight="500">TEQUILA ORGÁNICO</text>
    <text x="300" y="518" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="36" font-weight="500" fill="#2A2218">Extra <tspan font-style="italic" fill="#FBF7EE">Añejo</tspan></text>
    <text x="300" y="565" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#2A2218" fill-opacity="0.85">
      <tspan x="300" dy="0">Más de tres años en roble. Ámbar oscuro,</tspan>
      <tspan x="300" dy="18">complejo y sedoso — vainilla, cacao,</tspan>
      <tspan x="300" dy="18">cuero y agave añejo. Para sorber lento.</tspan>
    </text>
    <g transform="translate(40, 640)">
      <rect x="0" y="0" width="80" height="45" fill="#FBF7EE" stroke="#8A4E1E" stroke-opacity="0.32" rx="2"/>
      <text x="40" y="18" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" letter-spacing="1.5" fill="#8A4E1E" font-weight="500">VOL ALC</text>
      <text x="40" y="35" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="13" font-weight="500" fill="#2A2218">44.4%</text>

      <rect x="90" y="0" width="80" height="45" fill="#2A2218" rx="2"/>
      <text x="130" y="18" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" letter-spacing="1.5" fill="#E8CD8C" font-weight="500">GRADOS</text>
      <text x="130" y="35" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="13" font-weight="500" fill="#FBF7EE">88.8</text>

      <rect x="180" y="0" width="180" height="45" fill="#FBF7EE" stroke="#8A4E1E" stroke-opacity="0.32" rx="2"/>
      <text x="270" y="18" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" letter-spacing="1.5" fill="#8A4E1E" font-weight="500">REPOSO</text>
      <text x="270" y="35" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="11" font-weight="500" fill="#2A2218">3+ años · roble francés</text>

      <rect x="370" y="0" width="150" height="45" fill="#FBF7EE" stroke="#8A4E1E" stroke-opacity="0.32" rx="2"/>
      <text x="445" y="18" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" letter-spacing="1.5" fill="#8A4E1E" font-weight="500">COLOR</text>
      <text x="445" y="35" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="11" font-weight="500" fill="#2A2218">Ámbar oscuro</text>
    </g>
  </g>
</svg>
