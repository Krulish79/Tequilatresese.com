<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- ═══════════ SLIDE 07 · LAS EXPRESIONES ═══════════ -->

  <rect width="1920" height="1080" fill="#FBF7EE"/>

  <!-- Header -->
  <image xlink:href="../../images/Logos/logo-primary-black.png" x="120" y="88" width="90" height="60" preserveAspectRatio="xMinYMid meet"/>
  <text x="220" y="128" font-family="Cormorant Garamond, Georgia, serif" font-size="18" font-style="italic" fill="#2A2218">Tres Ese</text>
  <text x="1800" y="128" text-anchor="end" font-family="Inter, sans-serif" font-size="12" letter-spacing="4.5" fill="#8A4E1E">07 · LAS EXPRESIONES</text>
  <line x1="120" y1="160" x2="1800" y2="160" stroke="#C9B791" stroke-width="1"/>

  <!-- Eyebrow + title -->
  <g id="eyebrow">
    <line x1="120" y1="245" x2="180" y2="245" stroke="#8A4E1E" stroke-width="1.5"/>
    <text x="200" y="252" font-family="Inter, sans-serif" font-size="14" letter-spacing="5.5" fill="#8A4E1E" font-weight="500">TRES EXPRESIONES</text>
  </g>
  <text x="120" y="380" font-family="Cormorant Garamond, Georgia, serif" font-size="80" font-weight="500" fill="#2A2218">Un agave, <tspan font-style="italic" fill="#8A4E1E">tres momentos</tspan> en el tiempo.</text>
  <line x1="120" y1="435" x2="270" y2="435" stroke="#8A4E1E" stroke-width="1" stroke-opacity="0.6"/>

  <!-- 3 expression cards -->
  <g id="exp-blanco" transform="translate(120, 490)">
    <rect x="0" y="0" width="540" height="450" fill="#F4EEE2" rx="4"/>
    <image xlink:href="../../images/TresEse_Botella_Blanco.png" x="120" y="10" width="300" height="360" preserveAspectRatio="xMidYMax meet"/>
    <text x="270" y="410" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" letter-spacing="4" fill="#8A4E1E" font-weight="500">01 · SIN REPOSO</text>
    <text x="270" y="450" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="30" font-weight="500" fill="#2A2218">Blanco <tspan font-style="italic" fill="#8A4E1E">Orgánico</tspan></text>
    <text x="270" y="490" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="16" font-style="italic" fill="#8A4E1E">40.4% Vol · 80.8 Proof</text>
    <text x="270" y="540" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#584A38">
      <tspan x="270" dy="0">Cristalino. Directo del alambique.</tspan>
      <tspan x="270" dy="22">Nariz herbal, notas de citrus</tspan>
      <tspan x="270" dy="22">y minerales de sierra.</tspan>
    </text>
  </g>

  <g id="exp-reposado" transform="translate(690, 490)">
    <rect x="0" y="0" width="540" height="450" fill="#F4EEE2" rx="4"/>
    <image xlink:href="../../images/TresEse_Botella_Reposado.png" x="120" y="10" width="300" height="360" preserveAspectRatio="xMidYMax meet"/>
    <text x="270" y="410" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" letter-spacing="4" fill="#8A4E1E" font-weight="500">02 · 6 MESES</text>
    <text x="270" y="450" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="30" font-weight="500" fill="#2A2218">Reposado <tspan font-style="italic" fill="#8A4E1E">Orgánico</tspan></text>
    <text x="270" y="490" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="16" font-style="italic" fill="#8A4E1E">43.4% Vol · 86.8 Proof</text>
    <text x="270" y="540" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#584A38">
      <tspan x="270" dy="0">Oro pajizo. Seis meses en roble</tspan>
      <tspan x="270" dy="22">francés. Agave horneado, naranja</tspan>
      <tspan x="270" dy="22">confitada, cedro, especia suave.</tspan>
    </text>
  </g>

  <g id="exp-extra" transform="translate(1260, 490)">
    <rect x="0" y="0" width="540" height="450" fill="#F4EEE2" rx="4"/>
    <image xlink:href="../../images/TresEse_Botella_ExtraA&#xF1;ejo.png" x="120" y="10" width="300" height="360" preserveAspectRatio="xMidYMax meet"/>
    <text x="270" y="410" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" letter-spacing="4" fill="#8A4E1E" font-weight="500">03 · 3+ AÑOS</text>
    <text x="270" y="450" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="30" font-weight="500" fill="#2A2218">Extra <tspan font-style="italic" fill="#8A4E1E">Añejo</tspan></text>
    <text x="270" y="490" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="16" font-style="italic" fill="#8A4E1E">44.4% Vol · 88.8 Proof</text>
    <text x="270" y="540" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#584A38">
      <tspan x="270" dy="0">Ámbar oscuro. 3+ años en roble.</tspan>
      <tspan x="270" dy="22">Complejo, sedoso: vainilla, cacao,</tspan>
      <tspan x="270" dy="22">cuero y agave añejo. Sorber lento.</tspan>
    </text>
  </g>

  <!-- Closing line -->
  <text x="960" y="1000" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="20" font-style="italic" fill="#584A38">
    Tres botellas, un mismo campo. La única diferencia es el tiempo — y qué hace la madera con el agave.
  </text>

  <!-- Footer -->
  <line x1="120" y1="1030" x2="1800" y2="1030" stroke="#C9B791" stroke-width="1"/>
  <text x="120" y="1058" font-family="Inter, sans-serif" font-size="11" letter-spacing="3.5" fill="#8A7B62">BLANCO · REPOSADO · EXTRA AÑEJO</text>
  <text x="1800" y="1058" text-anchor="end" font-family="Inter, sans-serif" font-size="11" letter-spacing="3.5" fill="#8A7B62">PÁGINA 07</text>
</svg>
