<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- ═══════════ SLIDE 08 · POR LOS NÚMEROS ═══════════
       Atmospheric photograph (Reposado bottle on wooden barrel) as full-bleed
       background, dark scrim for legibility, 6 stat blocks overlaid. -->

  <defs>
    <linearGradient id="numScrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F0C08" stop-opacity="0.92"/>
      <stop offset="50%" stop-color="#1C1813" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F0C08" stop-opacity="0.92"/>
    </linearGradient>
  </defs>

  <!-- Background image + heavy dark scrim -->
  <image xlink:href="../../images/Tequila Reposado Bottle Photography.jpg"
         x="0" y="0" width="1920" height="1080"
         preserveAspectRatio="xMidYMid slice"/>
  <rect width="1920" height="1080" fill="url(#numScrim)"/>

  <!-- Header -->
  <image xlink:href="../../images/Logos/logo-primary-white.png" x="120" y="88" width="90" height="60" preserveAspectRatio="xMinYMid meet"/>
  <text x="220" y="128" font-family="Cormorant Garamond, Georgia, serif" font-size="18" font-style="italic" fill="#FBF7EE">Tres Ese</text>
  <text x="1800" y="128" text-anchor="end" font-family="Inter, sans-serif" font-size="12" letter-spacing="4.5" fill="#E8CD8C">08 · POR LOS NÚMEROS</text>
  <line x1="120" y1="160" x2="1800" y2="160" stroke="#E8CD8C" stroke-opacity="0.32" stroke-width="1"/>

  <!-- Eyebrow + title -->
  <g id="eyebrow">
    <line x1="120" y1="240" x2="180" y2="240" stroke="#E8CD8C" stroke-width="1.5"/>
    <text x="200" y="247" font-family="Inter, sans-serif" font-size="13" letter-spacing="5.5" fill="#E8CD8C" font-weight="500">POR LOS NÚMEROS</text>
  </g>
  <text x="120" y="335" font-family="Cormorant Garamond, Georgia, serif" font-size="82" font-weight="500" fill="#FBF7EE">La marca, en <tspan font-style="italic" fill="#E8CD8C">datos</tspan>.</text>
  <line x1="120" y1="378" x2="240" y2="378" stroke="#E8CD8C" stroke-width="1" stroke-opacity="0.7"/>

  <!-- 6 stat blocks — 3 columns × 2 rows -->
  <g id="n-1" transform="translate(120, 460)">
    <line x1="0" y1="0" x2="520" y2="0" stroke="#E8CD8C" stroke-opacity="0.32" stroke-width="1"/>
    <text x="0" y="90" font-family="Cormorant Garamond, Georgia, serif" font-size="80" font-style="italic" font-weight="500" fill="#E8CD8C">1905</text>
    <text x="0" y="140" font-family="Inter, sans-serif" font-size="13" letter-spacing="4.5" fill="#E8CD8C" fill-opacity="0.9">FUNDACIÓN</text>
    <text x="0" y="180" font-family="Inter, sans-serif" font-size="14" fill="#FBF7EE" fill-opacity="0.82">La familia planta su primer campo de agave en Los Altos.</text>
  </g>

  <g id="n-2" transform="translate(700, 460)">
    <line x1="0" y1="0" x2="520" y2="0" stroke="#E8CD8C" stroke-opacity="0.32" stroke-width="1"/>
    <text x="0" y="90" font-family="Cormorant Garamond, Georgia, serif" font-size="80" font-style="italic" font-weight="500" fill="#E8CD8C">5</text>
    <text x="0" y="140" font-family="Inter, sans-serif" font-size="13" letter-spacing="4.5" fill="#E8CD8C" fill-opacity="0.9">GENERACIONES</text>
    <text x="0" y="180" font-family="Inter, sans-serif" font-size="14" fill="#FBF7EE" fill-opacity="0.82">Un siglo y cuatro relevos familiares, sin cambiar el método.</text>
  </g>

  <g id="n-3" transform="translate(1280, 460)">
    <line x1="0" y1="0" x2="520" y2="0" stroke="#E8CD8C" stroke-opacity="0.32" stroke-width="1"/>
    <text x="0" y="90" font-family="Cormorant Garamond, Georgia, serif" font-size="80" font-style="italic" font-weight="500" fill="#E8CD8C">2,030 m</text>
    <text x="0" y="140" font-family="Inter, sans-serif" font-size="13" letter-spacing="4.5" fill="#E8CD8C" fill-opacity="0.9">ALTITUD</text>
    <text x="0" y="180" font-family="Inter, sans-serif" font-size="14" fill="#FBF7EE" fill-opacity="0.82">Tierra roja de sierra, noches frescas, maduración lenta.</text>
  </g>

  <g id="n-4" transform="translate(120, 730)">
    <line x1="0" y1="0" x2="520" y2="0" stroke="#E8CD8C" stroke-opacity="0.32" stroke-width="1"/>
    <text x="0" y="90" font-family="Cormorant Garamond, Georgia, serif" font-size="80" font-style="italic" font-weight="500" fill="#E8CD8C">6–8 años</text>
    <text x="0" y="140" font-family="Inter, sans-serif" font-size="13" letter-spacing="4.5" fill="#E8CD8C" fill-opacity="0.9">CULTIVO</text>
    <text x="0" y="180" font-family="Inter, sans-serif" font-size="14" fill="#FBF7EE" fill-opacity="0.82">Cada agave se cosecha al llegar a plena madurez.</text>
  </g>

  <g id="n-5" transform="translate(700, 730)">
    <line x1="0" y1="0" x2="520" y2="0" stroke="#E8CD8C" stroke-opacity="0.32" stroke-width="1"/>
    <text x="0" y="90" font-family="Cormorant Garamond, Georgia, serif" font-size="80" font-style="italic" font-weight="500" fill="#E8CD8C">100%</text>
    <text x="0" y="140" font-family="Inter, sans-serif" font-size="13" letter-spacing="4.5" fill="#E8CD8C" fill-opacity="0.9">AGAVE AZUL</text>
    <text x="0" y="180" font-family="Inter, sans-serif" font-size="14" fill="#FBF7EE" fill-opacity="0.82"><tspan font-family="Cormorant Garamond, Georgia, serif" font-style="italic" font-size="16">Agave tequilana.</tspan> Sin mezclas, sin atajos.</text>
  </g>

  <g id="n-6" transform="translate(1280, 730)">
    <line x1="0" y1="0" x2="520" y2="0" stroke="#E8CD8C" stroke-opacity="0.32" stroke-width="1"/>
    <text x="0" y="90" font-family="Cormorant Garamond, Georgia, serif" font-size="80" font-style="italic" font-weight="500" fill="#E8CD8C">4</text>
    <text x="0" y="140" font-family="Inter, sans-serif" font-size="13" letter-spacing="4.5" fill="#E8CD8C" fill-opacity="0.9">CERTIFICACIONES</text>
    <text x="0" y="180" font-family="Inter, sans-serif" font-size="14" fill="#FBF7EE" fill-opacity="0.82">USDA, UE, JAS y Bioagricert — auditadas cada año.</text>
  </g>

  <!-- Footer -->
  <line x1="120" y1="1030" x2="1800" y2="1030" stroke="#E8CD8C" stroke-opacity="0.32" stroke-width="1"/>
  <text x="120" y="1058" font-family="Inter, sans-serif" font-size="11" letter-spacing="3.5" fill="#E8CD8C" fill-opacity="0.75">LOS ALTOS DE JALISCO · MÉXICO</text>
  <text x="1800" y="1058" text-anchor="end" font-family="Inter, sans-serif" font-size="11" letter-spacing="3.5" fill="#E8CD8C" fill-opacity="0.75">PÁGINA 08</text>
</svg>
