<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- ═══════════ SLIDE 02 · MANIFIESTO ═══════════ -->

  <defs>
    <linearGradient id="bgNoir2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C1813"/>
      <stop offset="100%" stop-color="#2A2015"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgNoir2)"/>

  <!-- Header strip -->
  <image xlink:href="../../images/Logos/logo-primary-white.png" x="120" y="88" width="90" height="60" preserveAspectRatio="xMinYMid meet"/>
  <text x="220" y="128" font-family="Cormorant Garamond, Georgia, serif" font-size="18" font-style="italic" fill="#FBF7EE">Tres Ese</text>
  <text x="1800" y="128" text-anchor="end" font-family="Inter, sans-serif" font-size="12" letter-spacing="4.5" fill="#E8CD8C">02 · MANIFIESTO</text>
  <line x1="120" y1="160" x2="1800" y2="160" stroke="#E8CD8C" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Eyebrow -->
  <text x="120" y="380" font-family="Inter, sans-serif" font-size="16" letter-spacing="6" fill="#E8CD8C" font-weight="500">NUESTRA PROMESA</text>

  <!-- Big manifesto title -->
  <text x="120" y="530" font-family="Cormorant Garamond, Georgia, serif" font-size="120" font-weight="500" fill="#FBF7EE">Certificado <tspan font-style="italic" fill="#E8CD8C">orgánico.</tspan></text>
  <text x="120" y="670" font-family="Cormorant Garamond, Georgia, serif" font-size="120" font-weight="500" fill="#FBF7EE">Cero <tspan font-style="italic" fill="#E8CD8C">aditivos.</tspan> Siempre.</text>

  <!-- Support paragraph -->
  <text x="120" y="800" font-family="Cormorant Garamond, Georgia, serif" font-size="26" fill="#FBF7EE" fill-opacity="0.88">
    <tspan x="120" dy="0">Cinco generaciones de la <tspan font-style="italic" fill="#E8CD8C">familia Tres Ese</tspan> han trabajado la tierra roja de Los Altos de Jalisco</tspan>
    <tspan x="120" dy="42">sin herbicidas, sin fertilizantes sintéticos, sin atajos. Nada se añade en la botella.</tspan>
    <tspan x="120" dy="42">Sin azúcar. Sin glicerina. Sin saborizantes. Sin colorantes. Solo lo que la planta,</tspan>
    <tspan x="120" dy="42">la tierra y el sol de la sierra silenciosamente quisieron.</tspan>
  </text>

  <!-- Footer strip -->
  <line x1="120" y1="990" x2="1800" y2="990" stroke="#E8CD8C" stroke-opacity="0.2" stroke-width="1"/>
  <text x="120" y="1030" font-family="Inter, sans-serif" font-size="11" letter-spacing="3.5" fill="#E8CD8C" fill-opacity="0.7">TEQUILA TRES ESE</text>
  <text x="1800" y="1030" text-anchor="end" font-family="Inter, sans-serif" font-size="11" letter-spacing="3.5" fill="#E8CD8C" fill-opacity="0.7">MANIFIESTO DE MARCA</text>
</svg>
