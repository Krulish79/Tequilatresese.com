<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1920 1080"
     width="1920" height="1080">

  <!-- ═══════════ SLIDE 01 · PORTADA (image-forward hero) ═══════════ -->
  <!-- Full-bleed authentic photograph of the 3 bottles at golden hour on
       hacienda wooden table with sierra in the distance — mirrors the site's
       cinematic hero mood. Overlaid text uses noir gradient scrims for
       legibility without losing the image. -->

  <defs>
    <!-- Gradient scrims to hold text overlays without dulling the image -->
    <linearGradient id="topScrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F0C08" stop-opacity="0.72"/>
      <stop offset="60%" stop-color="#0F0C08" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomScrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0F0C08" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#0F0C08" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ─── FULL-BLEED PHOTOGRAPH ─── -->
  <image xlink:href="../../images/gallery/bottle-02.jpg"
         x="0" y="0" width="1920" height="1080"
         preserveAspectRatio="xMidYMid slice"/>

  <!-- Scrims -->
  <rect width="1920" height="1080" fill="url(#topScrim)"/>
  <rect width="1920" height="1080" fill="url(#bottomScrim)"/>

  <!-- ─── HEADER (top-left) — brand mark + category ─── -->
  <g id="header">
    <image xlink:href="../../images/Logos/logo-primary-white.png"
           x="120" y="88" width="150" height="100"
           preserveAspectRatio="xMinYMid meet"/>
    <text x="290" y="146"
          font-family="Inter, Helvetica, sans-serif"
          font-size="14" letter-spacing="4.5"
          fill="#E8CD8C" font-weight="500">TEQUILA · ORGÁNICO</text>
  </g>

  <!-- ─── TITLE BLOCK (bottom-left over dark scrim) ─── -->
  <g id="title">
    <text x="120" y="875"
          font-family="Inter, Helvetica, sans-serif"
          font-size="15" letter-spacing="5"
          fill="#E8CD8C" font-weight="500">DESDE 1905 · LOS ALTOS DE JALISCO</text>
    <text x="120" y="988"
          font-family="Cormorant Garamond, Georgia, serif"
          font-size="112" font-weight="500"
          fill="#FBF7EE">La <tspan font-style="italic" fill="#E8CD8C">Historia</tspan>.</text>
    <text x="120" y="1030"
          font-family="Cormorant Garamond, Georgia, serif"
          font-size="22" font-style="italic"
          fill="#E8CD8C" fill-opacity="0.9">Cinco generaciones. Cero aditivos. Una sola creencia.</text>
  </g>

  <!-- ─── PUBLICATION STAMP (bottom-right) ─── -->
  <g id="foot-right">
    <text x="1800" y="988"
          text-anchor="end"
          font-family="Inter, Helvetica, sans-serif"
          font-size="11" letter-spacing="3.5"
          fill="#E8CD8C" fill-opacity="0.7">PUBLICACIÓN</text>
    <text x="1800" y="1030"
          text-anchor="end"
          font-family="Cormorant Garamond, Georgia, serif"
          font-size="20" font-style="italic"
          fill="#E8CD8C">Manual de Marca · 2026</text>
  </g>

  <!-- Divider line at the bottom -->
  <line x1="120" y1="1055" x2="1800" y2="1055"
        stroke="#E8CD8C" stroke-opacity="0.32" stroke-width="1"/>

</svg>
