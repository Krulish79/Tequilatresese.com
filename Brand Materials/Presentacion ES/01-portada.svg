<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1920 1080"
     width="1920" height="1080">

  <!-- ═══════════ SLIDE 01 · PORTADA / COVER ═══════════ -->
  <!-- Tres Ese — La Historia
       16:9 landscape, 1920×1080. Editable in Illustrator.
       Text is LIVE, images are LINKED (see xlink:href paths). -->

  <defs>
    <!-- Noir vertical gradient bg -->
    <linearGradient id="bgNoir" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0F0C08"/>
      <stop offset="45%" stop-color="#1C1813"/>
      <stop offset="100%" stop-color="#3D2E1F"/>
    </linearGradient>
    <!-- Warm ambient glow behind the bottles -->
    <radialGradient id="glow" cx="50%" cy="52%" r="38%">
      <stop offset="0%"  stop-color="#E8CD8C" stop-opacity="0.24"/>
      <stop offset="60%" stop-color="#1C1813" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft drop-shadow for the bottles -->
    <filter id="bottleShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="24" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.55"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ─── BACKGROUND ─── -->
  <rect width="1920" height="1080" fill="url(#bgNoir)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- ─── HEADER (top-left) — brand mark + category ─── -->
  <g id="header">
    <image xlink:href="../../images/Logos/logo-primary-white.png"
           x="120" y="88" width="150" height="100"
           preserveAspectRatio="xMinYMid meet"/>
    <text x="290" y="146"
          font-family="Inter, Helvetica, sans-serif"
          font-size="14" letter-spacing="4.5"
          fill="#E8CD8C" font-weight="500">TEQUILA · ORGÁNICO</text>
  </g>

  <!-- ─── BOTTLE TRIO (center-stage) — clean product PNGs ─── -->
  <g id="bottles" filter="url(#bottleShadow)">
    <image xlink:href="../../images/TresEse_Botella_Blanco.png"
           x="510" y="200" width="300" height="620"
           preserveAspectRatio="xMidYMid meet"/>
    <image xlink:href="../../images/TresEse_Botella_Reposado.png"
           x="810" y="200" width="300" height="620"
           preserveAspectRatio="xMidYMid meet"/>
    <image xlink:href="../../images/TresEse_Botella_ExtraA&#xF1;ejo.png"
           x="1110" y="200" width="300" height="620"
           preserveAspectRatio="xMidYMid meet"/>
  </g>

  <!-- ─── TITLE BLOCK (bottom-left) ─── -->
  <g id="title">
    <text x="120" y="890"
          font-family="Inter, Helvetica, sans-serif"
          font-size="15" letter-spacing="5"
          fill="#E8CD8C" font-weight="500">DESDE 1905 · LOS ALTOS DE JALISCO</text>
    <text x="120" y="985"
          font-family="Cormorant Garamond, Georgia, serif"
          font-size="96" font-weight="500"
          fill="#FBF7EE">La <tspan font-style="italic" fill="#E8CD8C">Historia</tspan>.</text>
    <text x="120" y="1020"
          font-family="Cormorant Garamond, Georgia, serif"
          font-size="22" font-style="italic"
          fill="#E8CD8C" fill-opacity="0.85">Cinco generaciones. Cero aditivos. Una sola creencia.</text>
  </g>

  <!-- ─── FOOTER STAMPS (bottom-right) ─── -->
  <g id="footer">
    <line x1="120" y1="1055" x2="1800" y2="1055"
          stroke="#E8CD8C" stroke-opacity="0.25" stroke-width="1"/>
    <text x="1800" y="985"
          text-anchor="end"
          font-family="Inter, Helvetica, sans-serif"
          font-size="11" letter-spacing="3.5"
          fill="#E8CD8C" fill-opacity="0.65">PUBLICACIÓN</text>
    <text x="1800" y="1015"
          text-anchor="end"
          font-family="Cormorant Garamond, Georgia, serif"
          font-size="18" font-style="italic"
          fill="#E8CD8C">Manual de Marca · 2026</text>
  </g>

</svg>
