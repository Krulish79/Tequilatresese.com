<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1920 1080"
     width="1920" height="1080">

  <!-- ═══════════ SLIDE 01 · PORTADA / COVER ═══════════ -->
  <!-- Tres Ese — La Historia
       16:9 landscape, 1920×1080. Editable in Illustrator.
       Text is LIVE, images are LINKED (see xlink:href paths). -->

  <defs>
    <linearGradient id="bgNoir" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0F0C08"/>
      <stop offset="45%" stop-color="#1C1813"/>
      <stop offset="100%" stop-color="#3D2E1F"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="58%" r="42%">
      <stop offset="0%"  stop-color="#E8CD8C" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#E8CD8C" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#1C1813" stop-opacity="0"/>
    </radialGradient>
    <filter id="bottleShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dx="0" dy="32" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ─── BACKGROUND ─── -->
  <rect width="1920" height="1080" fill="url(#bgNoir)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- ─── HEADER (top-left) — brand mark + category ─── -->
  <g id="header">
    <image xlink:href="../../images/Logos/logo-primary-white.png"
           x="120" y="88" width="150" height="100"
           preserveAspectRatio="xMinYMid meet"/>
    <text x="290" y="146"
          font-family="Inter, Helvetica, sans-serif"
          font-size="14" letter-spacing="4.5"
          fill="#E8CD8C" font-weight="500">TEQUILA · ORGÁNICO</text>
  </g>

  <!-- ─── BOTTLE TRIO (dominant center-stage) ───
       Bottles at 480×920 each, positioned to fill the vertical
       space and feel present. Baseline is at y=940 so bottles
       stand on an implicit ground line just above the title. -->
  <g id="bottles" filter="url(#bottleShadow)">
    <image xlink:href="../../images/TresEse_Botella_Blanco.png"
           x="240" y="120" width="480" height="820"
           preserveAspectRatio="xMidYMax meet"/>
    <image xlink:href="../../images/TresEse_Botella_Reposado.png"
           x="720" y="120" width="480" height="820"
           preserveAspectRatio="xMidYMax meet"/>
    <image xlink:href="../../images/TresEse_Botella_ExtraA&#xF1;ejo.png"
           x="1200" y="120" width="480" height="820"
           preserveAspectRatio="xMidYMax meet"/>
  </g>

  <!-- ─── TITLE BLOCK (bottom-left) ─── -->
  <g id="title">
    <text x="120" y="945"
          font-family="Inter, Helvetica, sans-serif"
          font-size="14" letter-spacing="5"
          fill="#E8CD8C" font-weight="500">DESDE 1905 · LOS ALTOS DE JALISCO</text>
    <text x="120" y="1020"
          font-family="Cormorant Garamond, Georgia, serif"
          font-size="72" font-weight="500"
          fill="#FBF7EE">La <tspan font-style="italic" fill="#E8CD8C">Historia</tspan>.</text>
  </g>

  <!-- ─── SUB-TAGLINE + PUBLICATION STAMP (bottom-right) ─── -->
  <g id="foot-right">
    <text x="1800" y="945"
          text-anchor="end"
          font-family="Inter, Helvetica, sans-serif"
          font-size="11" letter-spacing="3.5"
          fill="#E8CD8C" fill-opacity="0.65">PUBLICACIÓN</text>
    <text x="1800" y="985"
          text-anchor="end"
          font-family="Cormorant Garamond, Georgia, serif"
          font-size="20" font-style="italic"
          fill="#E8CD8C">Manual de Marca · 2026</text>
    <text x="1800" y="1020"
          text-anchor="end"
          font-family="Cormorant Garamond, Georgia, serif"
          font-size="18" font-style="italic"
          fill="#E8CD8C" fill-opacity="0.75">Cinco generaciones. Cero aditivos.</text>
  </g>

  <!-- Divider line at the bottom -->
  <line x1="120" y1="1055" x2="1800" y2="1055"
        stroke="#E8CD8C" stroke-opacity="0.28" stroke-width="1"/>

</svg>
